<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BoatRadar</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root { --bg:#0f1720; --panel:#17212d; --line:#263444; --text:#e6edf3; --muted:#8b9bb0; --accent:#ffc83d; }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; font-family:system-ui, Segoe UI, sans-serif; background:var(--bg); color:var(--text); }
  #map { position:absolute; inset:0; background:#0b1118; }
  .tiles { filter: invert(1) hue-rotate(180deg) brightness(.9) contrast(.9); }
  header { position:absolute; top:12px; left:56px; z-index:1000; display:flex; gap:8px; align-items:center;
    background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:8px 12px; }
  header b { color:var(--accent); letter-spacing:.5px; }
  header input { background:#0f1720; border:1px solid var(--line); color:var(--text); border-radius:6px; padding:6px 8px; width:210px; }
  #status { font-size:12px; color:var(--muted); }
  #results { position:absolute; top:58px; left:56px; z-index:1000; background:var(--panel); border:1px solid var(--line);
    border-radius:10px; max-height:300px; overflow:auto; width:330px; display:none; }
  #results div { padding:7px 12px; cursor:pointer; font-size:13px; border-bottom:1px solid var(--line); }
  #results div:hover { background:#1f2c3b; }
  #panel { position:absolute; top:12px; right:12px; bottom:12px; width:340px; max-width:calc(100% - 24px); z-index:1000;
    background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px; overflow:auto; display:none; }
  #panel h2 { margin:0 0 2px; font-size:20px; }
  #panel .sub { color:var(--muted); font-size:13px; margin-bottom:12px; }
  #panel table { width:100%; border-collapse:collapse; font-size:13px; }
  #panel td { padding:5px 0; border-bottom:1px solid var(--line); vertical-align:top; }
  #panel td:first-child { color:var(--muted); width:42%; }
  #panel h3 { font-size:13px; text-transform:uppercase; letter-spacing:.6px; color:var(--accent); margin:18px 0 6px; }
  #panel p { font-size:12.5px; color:var(--muted); line-height:1.45; margin:6px 0; }
  #panel .link { display:block; width:100%; text-align:left; background:none; cursor:pointer; font-family:inherit; padding:8px 10px; margin:6px 0; border:1px solid var(--line); border-radius:8px;
    color:var(--text); text-decoration:none; font-size:13px; }
  #panel .link:hover { border-color:var(--accent); }
  #panel .link small { display:block; color:var(--muted); }
  #close { position:absolute; top:10px; right:12px; background:none; border:0; color:var(--muted); font-size:20px; cursor:pointer; }
  #legend { position:absolute; left:12px; bottom:24px; z-index:1000; background:var(--panel); border:1px solid var(--line);
    border-radius:10px; padding:8px 10px; font-size:12px; }
  #legend span { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:6px; }
  #legend div { margin:2px 0; }
  .hbtn { background:#0f1720; border:1px solid var(--line); color:var(--text); border-radius:6px; padding:6px 10px; cursor:pointer; white-space:nowrap; }
  .hbtn:hover { border-color:var(--accent); }
  #vf { position:absolute; inset:0; width:100%; height:100%; border:0; z-index:900; display:none; background:#0b1118; }
  body.vf #vf { display:block; }
  body.vf #legend, body.vf #panel, body.vf #status, body.vf #q, body.vf #results { display:none !important; }
  #panel .owner { display:block; width:100%; padding:12px; margin:8px 0 4px; border:0; border-radius:8px; cursor:pointer;
    background:var(--accent); color:#0f1720; font:600 14px system-ui, sans-serif; }
  #panel .owner:hover { filter:brightness(1.08); }
  #panel .owner small { display:block; font-weight:400; font-size:12px; margin-top:2px; }
  #toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); z-index:2000; max-width:calc(100% - 32px);
    background:var(--panel); border:1px solid var(--accent); border-radius:10px; padding:12px 16px; font-size:14px; display:none;
    box-shadow:0 6px 24px rgba(0,0,0,.4); }
  #toast b { color:var(--accent); font-size:18px; letter-spacing:.5px; user-select:all; }
</style>
</head>
<body>
<div id="map"></div>
<header>
  <b>⚓ BoatRadar</b>
  <input id="q" placeholder="Cerca nome, MMSI o IMO…" autocomplete="off">
  <span id="status">Caricamento…</span>
  <button id="registries" class="hbtn" title="Registri per trovare proprietari e armatori">📚 Registri</button>
  <button id="mode" class="hbtn" title="Passa alla mappa di VesselFinder">🌍 VesselFinder</button>
</header>
<iframe id="vf" title="Mappa VesselFinder"></iframe>
<div id="toast"></div>
<div id="results"></div>
<div id="legend"></div>
<aside id="panel"><button id="close">×</button><div id="content"></div></aside>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// Dati AIS live di tutto il mondo, raccolti da server.js tramite aisstream.io (solo l'area visibile).
// Dati AIS live del Baltico, aperti e senza chiave (Fintraffic / Digitraffic).
const API = '/api';
const BALTIC = 'https://meri.digitraffic.fi/api/ais/v1';
const REFRESH_MS = 15000;
const WINDOW_MS = 30 * 60 * 1000; // Baltico: solo navi viste negli ultimi 30 minuti

const TYPES = [
  { key:'cargo',     label:'Cargo',            color:'#5ad17c', test:t => t >= 70 && t <= 79 },
  { key:'tanker',    label:'Petroliera',       color:'#ff6b5e', test:t => t >= 80 && t <= 89 },
  { key:'passenger', label:'Passeggeri',       color:'#4da3ff', test:t => t >= 60 && t <= 69 },
  { key:'fishing',   label:'Pesca',            color:'#ff9f43', test:t => t === 30 },
  { key:'pleasure',  label:'Diporto / vela',   color:'#d77bff', test:t => t === 36 || t === 37 },
  { key:'service',   label:'Servizio / rimorchio', color:'#ffc83d', test:t => (t >= 31 && t <= 35) || (t >= 50 && t <= 59) },
  { key:'other',     label:'Altro / sconosciuto',  color:'#9aa7b6', test:() => true },
];
const typeOf = t => TYPES.find(x => x.test(t ?? -1));

const NAV_STATUS = ['In navigazione a motore','All\'ancora','Non governabile','Manovrabilità limitata','Limitata dal pescaggio',
  'Ormeggiata','Incagliata','In pesca','In navigazione a vela'];

// Prime 3 cifre dell'MMSI (MID) = stato di bandiera. Tabella parziale.
const MID = {201:'Albania',205:'Belgio',209:'Cipro',210:'Cipro',211:'Germania',212:'Cipro',215:'Malta',218:'Germania',219:'Danimarca',
  220:'Danimarca',224:'Spagna',225:'Spagna',226:'Francia',227:'Francia',228:'Francia',229:'Malta',230:'Finlandia',231:'Isole Faroe',
  232:'Regno Unito',233:'Regno Unito',234:'Regno Unito',235:'Regno Unito',236:'Gibilterra',237:'Grecia',238:'Croazia',239:'Grecia',
  240:'Grecia',241:'Grecia',244:'Paesi Bassi',245:'Paesi Bassi',246:'Paesi Bassi',247:'Italia',248:'Malta',249:'Malta',250:'Irlanda',
  251:'Islanda',253:'Lussemburgo',255:'Madeira',256:'Malta',257:'Norvegia',258:'Norvegia',259:'Norvegia',261:'Polonia',263:'Portogallo',
  265:'Svezia',266:'Svezia',269:'Svizzera',271:'Turchia',272:'Ucraina',273:'Russia',275:'Lettonia',276:'Estonia',277:'Lituania',
  303:'USA (Alaska)',304:'Antigua e Barbuda',305:'Antigua e Barbuda',308:'Bahamas',309:'Bahamas',310:'Bermuda',311:'Bahamas',
  316:'Canada',319:'Isole Cayman',338:'USA',351:'Panama',352:'Panama',353:'Panama',354:'Panama',355:'Panama',356:'Panama',357:'Panama',
  366:'USA',367:'USA',368:'USA',369:'USA',370:'Panama',371:'Panama',372:'Panama',373:'Panama',374:'Panama',375:'St. Vincent e Grenadine',
  376:'St. Vincent e Grenadine',377:'St. Vincent e Grenadine',378:'Isole Vergini Brit.',412:'Cina',413:'Cina',414:'Cina',431:'Giappone',
  432:'Giappone',440:'Corea del Sud',441:'Corea del Sud',477:'Hong Kong',518:'Isole Cook',538:'Isole Marshall',563:'Singapore',
  564:'Singapore',565:'Singapore',566:'Singapore',636:'Liberia',637:'Liberia',
  242:'Marocco',252:'Liechtenstein',254:'Monaco',262:'Montenegro',264:'Romania',267:'Slovacchia',270:'Rep. Ceca',274:'Macedonia del Nord',
  278:'Slovenia',279:'Serbia',207:'Bulgaria',208:'Vaticano',203:'Austria',204:'Azzorre',206:'Bielorussia',213:'Georgia',214:'Moldavia',
  216:'Armenia',243:'Ungheria',
  312:'Belize',314:'Barbados',323:'Cuba',325:'Dominica',327:'Rep. Dominicana',330:'Grenada',332:'Guatemala',334:'Honduras',
  336:'Haiti',339:'Giamaica',341:'St. Kitts e Nevis',343:'St. Lucia',345:'Messico',350:'Nicaragua',362:'Trinidad e Tobago',
  401:'Afghanistan',403:'Arabia Saudita',405:'Bangladesh',408:'Bahrein',410:'Bhutan',416:'Taiwan',417:'Sri Lanka',419:'India',
  422:'Iran',423:'Azerbaigian',425:'Iraq',428:'Israele',436:'Kazakistan',438:'Giordania',445:'Corea del Nord',447:'Kuwait',
  450:'Libano',455:'Maldive',457:'Mongolia',459:'Nepal',461:'Oman',463:'Pakistan',466:'Qatar',468:'Siria',470:'Emirati Arabi',
  471:'Emirati Arabi',472:'Tagikistan',473:'Yemen',475:'Yemen',503:'Australia',506:'Myanmar',508:'Brunei',510:'Micronesia',
  511:'Palau',512:'Nuova Zelanda',514:'Cambogia',515:'Cambogia',520:'Figi',523:'Isole Cocos',525:'Indonesia',529:'Kiribati',
  533:'Malesia',536:'Isole Marianne',544:'Nauru',546:'Polinesia Francese',548:'Filippine',553:'Papua Nuova Guinea',557:'Isole Salomone',
  559:'Samoa Americane',561:'Samoa',567:'Thailandia',570:'Tonga',572:'Tuvalu',574:'Vietnam',576:'Vanuatu',577:'Vanuatu',
  601:'Sudafrica',603:'Angola',605:'Algeria',609:'Burundi',610:'Benin',613:'Camerun',616:'Comore',618:'Crozet',619:'Costa d\'Avorio',
  620:'Comore',621:'Gibuti',622:'Egitto',624:'Etiopia',625:'Eritrea',626:'Gabon',627:'Ghana',629:'Gambia',630:'Guinea-Bissau',
  631:'Guinea Equatoriale',632:'Guinea',634:'Kenya',642:'Libia',644:'Lesotho',645:'Mauritius',647:'Madagascar',649:'Mali',
  650:'Mozambico',654:'Mauritania',655:'Malawi',656:'Niger',657:'Nigeria',659:'Namibia',660:'Riunione',661:'Ruanda',662:'Sudan',
  663:'Senegal',664:'Seychelles',666:'Somalia',667:'Sierra Leone',668:'São Tomé',669:'Eswatini',671:'Togo',672:'Tunisia',
  674:'Tanzania',675:'Uganda',676:'Congo (RD)',677:'Tanzania',678:'Zambia',679:'Zimbabwe',
  701:'Argentina',710:'Brasile',720:'Bolivia',725:'Cile',730:'Colombia',735:'Ecuador',740:'Falkland',745:'Guyana francese',
  750:'Guyana',755:'Paraguay',760:'Perù',765:'Suriname',770:'Uruguay',775:'Venezuela'};

const $ = id => document.getElementById(id);
const map = L.map('map', { preferCanvas:true, zoomControl:true, worldCopyJump:true }).setView([30, 10], 3);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 18, className: 'tiles', attribution: '© OpenStreetMap · AIS: aisstream.io, Fintraffic / digitraffic.fi (CC BY 4.0)'
}).addTo(map);
const renderer = L.canvas({ padding: 0.5 });

// Nave in movimento: freccia orientata sulla rotta. Ferma o senza rotta: pallino.
const ShipMarker = L.CircleMarker.extend({
  setHeading(h) { this.options.heading = h; return this.redraw(); },
  _updatePath() {
    const r = this._renderer, h = this.options.heading;
    if (h == null) return r._updateCircle(this);
    if (!r._drawing || this._empty()) return;
    const ctx = r._ctx, p = this._point, s = this.options.radius;
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(h * Math.PI / 180);
    ctx.beginPath();
    ctx.moveTo(0, -s * 2); ctx.lineTo(s * 1.1, s * 1.5); ctx.lineTo(0, s * 0.9); ctx.lineTo(-s * 1.1, s * 1.5); ctx.closePath();
    ctx.restore();
    r._fillStroke(ctx, this);
  },
});
const heading = p => p.sog > 0.5 && p.sog < 102.3 && p.cog != null && p.cog < 360 ? p.cog : null;
new ResizeObserver(() => map.invalidateSize()).observe($('map'));

const meta = new Map();     // mmsi -> dati statici (nome, IMO, tipo…)
const markers = new Map();  // mmsi -> { marker, props }
let selected = null;
let worldTotal = 0;

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

$('legend').innerHTML = TYPES.map(t => `<div><span style="background:${t.color}"></span>${t.label}</div>`).join('');

async function loadDetail(mmsi) {
  const v = await fetch(`${API}/vessel?mmsi=${mmsi}`).then(r => r.ok ? r.json() : null).catch(() => null);
  if (v) meta.set(mmsi, { ...meta.get(mmsi), ...v });
}

function viewBox() {
  const b = map.getBounds().pad(0.2);
  if (b.getEast() - b.getWest() >= 360) return '-180,-90,180,90';
  const lon = x => ((x + 180) % 360 + 360) % 360 - 180;
  return [lon(b.getWest()), Math.max(b.getSouth(), -90), lon(b.getEast()), Math.min(b.getNorth(), 90)].map(x => x.toFixed(3)).join(',');
}

async function loadBalticMeta() {
  const res = await fetch(`${BALTIC}/vessels`);
  if (!res.ok) throw new Error('vessels ' + res.status);
  for (const v of await res.json()) meta.set(v.mmsi, { ...v, draught: v.draught / 10 });
}

async function features(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error('locations ' + res.status);
  const fc = await res.json();
  if (fc.total != null) worldTotal = fc.total;
  return fc.features;
}

async function loadLocations() {
  const [med, baltic] = await Promise.allSettled([
    features(`${API}/locations?bbox=${viewBox()}`), features(`${BALTIC}/locations?from=${Date.now() - WINDOW_MS}`)]);
  if (med.status === 'rejected' && baltic.status === 'rejected') throw med.reason;
  const seen = new Set();
  for (const f of [...(baltic.value || []), ...(med.value || [])]) {
    const mmsi = f.mmsi ?? f.properties.mmsi;
    const [lon, lat] = f.geometry.coordinates;
    seen.add(mmsi);
    const { name, shipType } = f.properties;
    if (name || shipType != null) meta.set(mmsi, { ...meta.get(mmsi), ...(name && { name }), ...(shipType != null && { shipType }) });
    const color = typeOf(meta.get(mmsi)?.shipType).color;
    let m = markers.get(mmsi);
    if (!m) {
      const marker = new ShipMarker([lat, lon], { renderer, radius:4, weight:1, color:'#0b1118', fillColor:color, fillOpacity:.95,
        heading: heading(f.properties) })
        .on('click', () => select(mmsi)).addTo(map);
      marker.bindTooltip(() => meta.get(mmsi)?.name || String(mmsi), { direction:'top' });
      m = { marker };
      markers.set(mmsi, m);
    } else {
      m.marker.setLatLng([lat, lon]);
      m.marker.options.heading = heading(f.properties);
      m.marker.setStyle({ fillColor: color });
    }
    m.props = f.properties;
  }
  for (const [mmsi, m] of markers) if (!seen.has(mmsi)) { m.marker.remove(); markers.delete(mmsi); }
  const st = await fetch(`${API}/status`).then(r => r.json());
  const note = !st.hasKey ? ' · Mondo: manca la chiave gratuita di aisstream.io in aisstream-key.txt (ora solo Baltico)'
    : st.error ? ' · Mondo: ' + st.error
    : !st.connected ? ' · Mondo: connessione…'
    : ` · ${st.vessels} nel mondo` + (worldTotal > markers.size ? ' (zoom per vederle tutte)' : '');
  $('status').textContent = `${markers.size} in mappa · agg. ${new Date().toLocaleTimeString('it-IT')}${note}`;
  if (selected && markers.has(selected)) render(selected);
}

function select(mmsi) {
  if (selected && markers.has(selected)) markers.get(selected).marker.setStyle({ radius:4, color:'#0b1118', weight:1 });
  selected = mmsi;
  const m = markers.get(mmsi);
  if (m) { m.marker.setStyle({ radius:8, color:'#ffc83d', weight:3 }).bringToFront(); }
  render(mmsi);
  $('panel').style.display = 'block';
  if (!meta.get(mmsi)?.callSign) loadDetail(mmsi).then(() => selected === mmsi && render(mmsi));
}

function render(mmsi) {
  const v = meta.get(mmsi) || {};
  const p = markers.get(mmsi)?.props || {};
  const flag = MID[String(mmsi).slice(0, 3)] || '—';
  const imo = v.imo && v.imo > 0 ? v.imo : null;
  const row = (k, val) => `<tr><td>${k}</td><td>${esc(val == null || val === '' ? '—' : val)}</td></tr>`;
  $('content').innerHTML = `
    <h2>${esc(v.name || 'Senza nome')}</h2>
    <div class="sub">${esc(typeOf(v.shipType).label)} · bandiera ${esc(flag)}</div>
    <table>
      ${row('MMSI', mmsi)}
      ${row('IMO', imo)}
      ${row('Nominativo', v.callSign)}
      ${row('Destinazione', v.destination)}
      ${row('Pescaggio', v.draught ? v.draught.toFixed(1) + ' m' : null)}
      ${row('Velocità', p.sog != null && p.sog < 102.3 ? p.sog.toFixed(1) + ' kn' : null)}
      ${row('Rotta', p.cog != null && p.cog < 360 ? p.cog.toFixed(0) + '°' : null)}
      ${row('Stato', NAV_STATUS[p.navStat])}
      ${row('Ultimo segnale', p.timestampExternal ? new Date(p.timestampExternal).toLocaleString('it-IT') : null)}
    </table>

    <h3>Chi è il proprietario?</h3>
    <button class="owner" data-registry="${imo ? 'equasis' : 'itu'}" data-id="${imo || mmsi}">🔎 Trova il proprietario
      <small>${imo ? 'Apre Equasis con l\'IMO ' + imo + ' già copiato' : 'Apre ITU MARS con l\'MMSI ' + mmsi + ' già copiato'}</small></button>
    ${imo ? registryButton('itu', { MMSI: mmsi }) : ''}
    <button class="link" data-show-vf="${mmsi}">Mostra sulla mappa VesselFinder
      <small>Posizione e rotta secondo VesselFinder</small></button>
    <a class="link" target="_blank" rel="noopener" href="https://www.vesselfinder.com/vessels/details/${imo || mmsi}">VesselFinder
      <small>Scheda nave, foto, porto di partenza e arrivo</small></a>
    <a class="link" target="_blank" rel="noopener" href="https://www.marinetraffic.com/en/ais/details/ships/mmsi:${mmsi}">MarineTraffic
      <small>Scheda nave, foto, storico scali</small></a>
    ${imo ? '<h3>Società di classificazione</h3><p>Su Equasis, alla voce <i>Classification</i>, vedi quale società segue la nave.</p>'
      + ['lr', 'dnv', 'abs', 'classnk'].map(k => registryButton(k, { IMO: imo })).join('') : ''}
    <h3>Risalire alla società</h3>
    ${['opencorporates', 'companieshouse', 'mbr'].map(k => registryButton(k)).join('')}
    ${String(mmsi).startsWith('247') ? '<h3>Barca italiana</h3>' + ['sted', 'guardiacostiera'].map(k => registryButton(k)).join('') : ''}`;
}

// Pagina con tutti i registri, apribile dal pulsante in alto anche senza aver scelto una nave
function showRegistries() {
  if (selected && markers.has(selected)) markers.get(selected).marker.setStyle({ radius:4, color:'#0b1118', weight:1 });
  selected = null;
  $('content').innerHTML = `<h2>Registri</h2>
    <div class="sub">Dove cercare proprietari e armatori. Dalla scheda di una nave gli stessi registri si aprono con IMO o MMSI già copiato.</div>`
    + registryList();
  $('panel').style.display = 'block';
}

$('close').onclick = () => { $('panel').style.display = 'none'; };

// Proprietario: i registri non accettano ricerche da link, quindi copio IMO/MMSI, apro il registro
// e mostro cosa incollare. Equasis chiede l'accesso (gratuito) solo la prima volta.
const REGISTRY = {
  equasis: { group: 'ship', name: 'Equasis', copy: 'IMO', url: 'https://www.equasis.org/',
    desc: 'Proprietario registrato, gestore tecnico e commerciale, storico. Gratuito con registrazione.',
    how: 'In Equasis accedi (la prima volta), poi incolla nel campo <i>IMO, Name, Company</i> in alto a destra e premi invio.' },
  itu: { group: 'ship', name: 'ITU MARS', copy: 'MMSI', url: 'https://www.itu.int/mmsapp/ShipStation/list',
    desc: 'Titolare della licenza radio (voce Owner). Gratuito, senza registrazione.',
    how: 'In ITU MARS incolla nel campo <i>MMSI</i>, premi invio e apri la nave (icona dell\'occhio): il proprietario è alla voce <i>Owner</i>.' },
  lr: { group: 'class', name: 'Lloyd\'s Register', copy: 'IMO', url: 'https://www.lr.org/en/lrofships/',
    desc: 'Navi classificate LR: dati della nave, armatore e gestore.',
    how: 'Nel registro di Lloyd\'s Register incolla nel campo di ricerca (IMO number) e avvia la ricerca.' },
  dnv: { group: 'class', name: 'DNV Vessel Register', copy: 'IMO', url: 'https://www.dnv.com/maritime/vesselregister',
    desc: 'Navi classificate DNV: armatori, gestori, notazioni di classe.',
    how: 'Nel DNV Vessel Register incolla nel campo di ricerca (accetta l\'IMO) e avvia la ricerca.' },
  abs: { group: 'class', name: 'ABS Record', copy: 'IMO', url: 'https://ww2.eagle.org/en/rules-and-resources/databases/abs-record.html',
    desc: 'Navi classificate ABS: dati principali, cantiere, armatore.',
    how: 'Apri ABS Record dalla pagina, poi incolla l\'IMO nella ricerca.' },
  classnk: { group: 'class', name: 'ClassNK', copy: 'IMO', url: 'https://www.classnk.or.jp/register/regships/regships.aspx',
    desc: 'Navi classificate ClassNK (Giappone).',
    how: 'Nel registro ClassNK incolla nel campo IMO e avvia la ricerca.' },
  opencorporates: { group: 'company', name: 'OpenCorporates', url: 'https://opencorporates.com/',
    desc: 'Società di tutto il mondo: cerca il nome dell\'armatore trovato su Equasis o nei registri di classe.' },
  companieshouse: { group: 'company', name: 'Companies House (Regno Unito)', url: 'https://find-and-update.company-information.service.gov.uk/',
    desc: 'Società britanniche: amministratori e soci, gratuito.' },
  mbr: { group: 'company', name: 'Malta Business Registry', url: 'https://registry.mbr.mt/ROC/',
    desc: 'Società maltesi (molti yacht sono intestati qui): ricerca gratuita, documenti a pagamento.' },
  sted: { group: 'italy', name: 'Visura unità da diporto (STED)', url: 'https://www.mit.gov.it/node/11225',
    desc: 'Barche da diporto italiane iscritte: visura presso uno Sportello Telematico del Diportista (Capitanerie, Motorizzazione, agenzie nautiche). Serve la sigla di iscrizione.' },
  guardiacostiera: { group: 'italy', name: 'Guardia Costiera / Capitanerie di porto', url: 'https://www.guardiacostiera.gov.it/',
    desc: 'Per incidenti, danni o barche abbandonate: identificano il proprietario anche quando i dati non sono pubblici.' },
};
const REGISTRY_GROUPS = { ship: 'Registri della nave', class: 'Società di classificazione (navi con IMO)',
  company: 'Registri delle società (per risalire a chi c\'è dietro l\'armatore)', italy: 'Barche da diporto in Italia' };

// Pulsante di un registro: se c'è un identificativo da copiare lo copia aprendo il sito
function registryButton(key, ids = {}) {
  const r = REGISTRY[key], id = r.copy ? ids[r.copy] : '';
  return `<button class="link" data-registry="${key}" data-id="${esc(id || '')}">${esc(r.name)}
    <small>${id ? r.copy + ' ' + esc(id) + ' · ' : ''}${esc(r.desc)}</small></button>`;
}

function registryList(ids = {}) {
  return Object.entries(REGISTRY_GROUPS).map(([group, title]) => {
    const keys = Object.keys(REGISTRY).filter(k => REGISTRY[k].group === group);
    return `<h3>${esc(title)}</h3>` + keys.map(k => registryButton(k, ids)).join('');
  }).join('');
}

let toastTimer;
function toast(html) {
  $('toast').innerHTML = html;
  $('toast').style.display = 'block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { $('toast').style.display = 'none'; }, 15000);
}
$('toast').onclick = () => { $('toast').style.display = 'none'; };

$('content').addEventListener('click', e => {
  const reg = e.target.closest('[data-registry]');
  if (reg) {
    const r = REGISTRY[reg.dataset.registry], id = reg.dataset.id;
    window.open(r.url, '_blank', 'noopener');
    if (!id) return;
    const show = copied => toast(`${r.copy} <b>${esc(id)}</b> ${copied ? 'copiato.' : '(selezionalo e copialo).'} ${r.how}`);
    if (navigator.clipboard) navigator.clipboard.writeText(id).then(() => show(true), () => show(false));
    else show(false);
    return;
  }
  const vf = e.target.closest('[data-show-vf]');
  if (vf) setMode(true, Number(vf.dataset.showVf));
});

// Seconda mappa: VesselFinder, centrata dove si trova la nostra (o sulla nave scelta)
function setMode(vesselFinder, mmsi) {
  document.body.classList.toggle('vf', vesselFinder);
  $('mode').textContent = vesselFinder ? '⚓ Mappa BoatRadar' : '🌍 VesselFinder';
  $('mode').title = vesselFinder ? 'Torna alla mappa di BoatRadar' : 'Passa alla mappa di VesselFinder';
  if (!vesselFinder) return;
  const pos = mmsi && markers.get(mmsi)?.marker.getLatLng();
  const c = pos || map.getCenter();
  const zoom = pos ? Math.max(map.getZoom(), 10) : map.getZoom();
  const params = new URLSearchParams({ lat: c.lat.toFixed(4), lon: L.Util.wrapNum(c.lng, [-180, 180], true).toFixed(4),
    zoom: Math.max(3, zoom) });
  if (mmsi) params.set('mmsi', mmsi);
  $('vf').src = '/vesselfinder.html?' + params;
}
$('mode').onclick = () => setMode(!document.body.classList.contains('vf'));
$('registries').onclick = () => { setMode(false); showRegistries(); };

const found = new Map(); // mmsi -> [lat, lon] dei risultati di ricerca

$('q').addEventListener('input', async e => {
  const q = e.target.value.trim().toUpperCase();
  const box = $('results');
  if (q.length < 2) { box.style.display = 'none'; return; }
  const remote = await fetch(`${API}/search?q=${encodeURIComponent(q)}`).then(r => r.json()).catch(() => []);
  if (q !== $('q').value.trim().toUpperCase()) return; // nel frattempo l'utente ha scritto altro
  found.clear();
  const hits = [];
  for (const v of remote) {
    meta.set(v.mmsi, { ...meta.get(v.mmsi), ...v });
    found.set(v.mmsi, [v.lat, v.lon]);
    hits.push({ mmsi: v.mmsi, v });
  }
  for (const [mmsi, m] of markers) {
    if (hits.length >= 25) break;
    const v = meta.get(mmsi) || {};
    if (found.has(mmsi)) continue;
    if ((v.name || '').toUpperCase().includes(q) || String(mmsi).startsWith(q) || String(v.imo || '').startsWith(q)) {
      found.set(mmsi, m.marker.getLatLng());
      hits.push({ mmsi, v });
    }
  }
  box.innerHTML = hits.length
    ? hits.map(h => `<div data-mmsi="${h.mmsi}">${esc(h.v.name || 'Senza nome')} <span style="color:var(--muted)">· ${h.mmsi}</span></div>`).join('')
    : '<div>Nessun risultato</div>';
  box.style.display = 'block';
});

$('results').addEventListener('click', async e => {
  const mmsi = Number(e.target.closest('[data-mmsi]')?.dataset.mmsi);
  if (!mmsi || !found.has(mmsi)) return;
  $('results').style.display = 'none';
  map.setView(found.get(mmsi), Math.max(map.getZoom(), 11), { animate:false });
  await tick();
  select(mmsi);
});

async function tick() {
  try { await loadLocations(); }
  catch (err) { $('status').textContent = 'Errore dati AIS: ' + err.message; }
}

(async () => {
  await loadBalticMeta().catch(err => console.warn(err));
  await tick();
  setInterval(tick, REFRESH_MS);
  let moveTimer;
  map.on('moveend', () => { clearTimeout(moveTimer); moveTimer = setTimeout(tick, 300); });
  setInterval(() => loadBalticMeta().catch(() => {}), 10 * 60 * 1000);
})();
</script>
