<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BoatRadar</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root { --bg:#0f1720; --panel:#17212d; --line:#263444; --text:#e6edf3; --muted:#8b9bb0; --accent:#ffc83d; }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; font-family:system-ui, Segoe UI, sans-serif; background:var(--bg); color:var(--text); }
  #map { position:absolute; inset:0; background:#0b1118; }
  .tiles { filter: invert(1) hue-rotate(180deg) brightness(.9) contrast(.9); }
  header { position:absolute; top:12px; left:56px; z-index:1100; display:flex; gap:8px; align-items:center;
    background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:8px 12px; }
  header b { color:var(--accent); letter-spacing:.5px; }
  header input { background:#0f1720; border:1px solid var(--line); color:var(--text); border-radius:6px; padding:6px 8px; width:210px; }
  #status { font-size:12px; color:var(--muted); }
  #results { position:absolute; top:calc(100% + 6px); left:0; z-index:1100; background:var(--panel); border:1px solid var(--line);
    border-radius:10px; max-height:300px; overflow:auto; width:330px; max-width:calc(100vw - 72px); display:none; }
  #results div { padding:7px 12px; cursor:pointer; font-size:13px; border-bottom:1px solid var(--line); }
  #results div:hover { background:#1f2c3b; }
  /* punto 12: riga attiva da tastiera (aria-selected), con lo stesso bordo azzurro del popup di scelta (≥ 3:1) */
  #results [aria-selected="true"] { background:#1f2c3b; outline:2px solid #7cc4ff; outline-offset:-2px; }
  #results b { color:var(--text); letter-spacing:0; }   /* il nome non prende il giallo del titolo nell'header */
  #results .mmsi { color:var(--muted); font-size:12px; margin-left:4px; }
  #results small { display:block; color:var(--muted); font-size:12px; margin-top:2px; }
  #results .twins { color:var(--accent); }
  #results .none { cursor:default; color:var(--muted); }
  #results .none:hover { background:none; }
  /* punto 62: pallino dell'età della posizione (sempre con il testo accanto). Tre luminanze diverse, dal più chiaro
     (fresca) al più scuro (vecchia), così si distinguono anche senza vedere la tinta; tutti ≥ 3:1 sul pannello #17212d
     (8,4 · 6,4 · 3,5) e sul risultato evidenziato #1f2c3b; fra vicini 1,31 e 1,82 (test in test/ais-logic.test.js) */
  .age { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; vertical-align:1px; }
  .age-verde { background:#56d364; }
  .age-arancio { background:#f0883e; }
  .age-rosso { background:#da3633; }
  #panel { position:absolute; top:12px; right:12px; bottom:12px; width:340px; max-width:calc(100% - 24px); z-index:1000;
    background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px; overflow:auto; display:none; }
  #panel h2 { margin:0 0 2px; padding-right:32px; font-size:20px; }   /* spazio per la × */
  #panel .sub { color:var(--muted); font-size:13px; margin-bottom:12px; }
  #panel table { width:100%; border-collapse:collapse; font-size:13px; }
  #panel td { padding:5px 0; border-bottom:1px solid var(--line); vertical-align:top; }
  #panel td:first-child { color:var(--muted); width:42%; }
  #panel h3 { font-size:13px; text-transform:uppercase; letter-spacing:.6px; color:var(--accent); margin:18px 0 6px; }
  #panel p { font-size:12.5px; color:var(--muted); line-height:1.45; margin:6px 0; }
  #panel .link { display:block; width:100%; text-align:left; background:none; cursor:pointer; font-family:inherit; padding:8px 10px; margin:6px 0; border:1px solid var(--line); border-radius:8px;
    color:var(--text); text-decoration:none; font-size:13px; }
  #panel .link:hover { border-color:var(--accent); }
  #panel .link small { display:block; color:var(--muted); }
  /* × della scheda: bersaglio da 44×44 px (anche su telefono) */
  #close { position:absolute; top:4px; right:4px; width:44px; height:44px; display:grid; place-items:center; padding:0;
    background:none; border:0; border-radius:8px; color:var(--muted); font-size:24px; line-height:1; cursor:pointer; }
  #close:hover, #close:focus-visible { color:var(--accent); }
  #legend { position:absolute; left:12px; bottom:24px; z-index:1000; background:var(--panel); border:1px solid var(--line);
    border-radius:10px; padding:8px 10px; font-size:12px; }
  #legend span { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:6px; }
  #legend div { margin:2px 0; }
  #legend summary { cursor:pointer; color:var(--muted); padding:2px 0; }
  #legend summary:hover, #legend summary:focus-visible { color:var(--accent); }
  #legend .sym { display:flex; align-items:center; gap:6px; margin-top:4px; }
  #legend-types + .sym { border-top:1px solid var(--line); padding-top:6px; }   /* separatore fra tipi e simboli */
  #legend svg { width:12px; height:16px; flex:none; fill:var(--text); stroke:#0b1118; stroke-width:1; }
  #legend svg .old { fill-opacity:.2; stroke:#c9d4e0; stroke-width:1.5; stroke-dasharray:3 2; }
  #legend svg .fading { fill-opacity:.5; stroke:#c9d4e0; stroke-width:1; }
  /* scheda aperta (desktop): l'header (z-index 1100) non si allarga sopra la scheda (destra 12 px + 340 px) e va
     a capo; prima con una riga di stato lunga copriva la × e il clic arrivava al pulsante VesselFinder */
  @media (min-width: 641px) {
    body.panel-open:not(.vf) header { max-width:calc(100% - 56px - 352px - 8px); flex-wrap:wrap; }
    body.panel-open:not(.vf) #status { flex-basis:100%; order:5; }   /* riga di stato sotto, come su telefono */
  }
  .hbtn { background:#0f1720; border:1px solid var(--line); color:var(--text); border-radius:6px; padding:6px 10px; cursor:pointer; white-space:nowrap; }
  .hbtn:hover { border-color:var(--accent); }
  #vf { position:absolute; inset:0; width:100%; height:100%; border:0; z-index:900; display:none; background:#0b1118; }
  body.vf #vf { display:block; }
  body.vf #legend, body.vf #panel, body.vf #status, body.vf #q, body.vf #results { display:none !important; }
  #panel .owner { display:block; width:100%; padding:12px; margin:8px 0 4px; border:0; border-radius:8px; cursor:pointer;
    background:var(--accent); color:#0f1720; font:600 14px system-ui, sans-serif; }
  #panel .owner:hover { filter:brightness(1.08); }
  #panel .owner small { display:block; font-weight:400; font-size:12px; margin-top:2px; }
  #panel .step { display:flex; gap:8px; align-items:flex-start; font-size:12.5px; color:var(--muted); margin:14px 0 6px; line-height:1.4; }
  #panel .step span { flex:none; width:20px; height:20px; border-radius:50%; background:var(--accent); color:#0f1720;
    font-weight:700; font-size:12px; display:grid; place-items:center; }
  #company { width:100%; background:#0f1720; border:1px solid var(--line); color:var(--text); border-radius:8px; padding:9px 10px; font-size:14px; }
  #company:focus { outline:none; border-color:var(--accent); }
  #panel .chips { display:flex; flex-wrap:wrap; gap:6px; }
  #panel .chip { background:#0f1720; border:1px solid var(--line); color:var(--text); border-radius:999px; padding:6px 11px;
    font-size:12.5px; cursor:pointer; }
  #panel .chip:hover { border-color:var(--accent); }
  #panel details { border-top:1px solid var(--line); padding:4px 0; }
  #panel summary { cursor:pointer; padding:8px 0; font-size:13px; }
  #panel summary:hover { color:var(--accent); }
  #panel td.wait { color:var(--muted); font-size:12px; font-style:italic; width:auto; }
  #panel .vfmore { border-color:#2c4a63; }
  #panel tr.owned td { color:var(--accent); font-weight:600; }
  /* punto 10: popup di scelta fra navi sovrapposte, scuro come la scheda; righe e × da almeno 44 px */
  .pick .leaflet-popup-content-wrapper, .pick .leaflet-popup-tip { background:var(--panel); color:var(--text);
    border:1px solid var(--line); box-shadow:0 6px 24px rgba(0,0,0,.4); }
  .pick .leaflet-popup-content-wrapper { border-radius:10px; }
  /* altezza massima: maxHeight del popup, calcolata in openPick sullo spazio libero (pickMaxHeight); oltre si scorre */
  .pick .leaflet-popup-content { margin:8px; font:13px system-ui, Segoe UI, sans-serif; }
  .pick .pick-title { margin:4px 40px 6px 4px; color:var(--muted); font-size:12px; }
  .pick .pickrow { display:block; width:100%; min-height:44px; margin:0 0 4px; padding:6px 10px; text-align:left; cursor:pointer;
    background:#0f1720; border:1px solid var(--line); border-radius:8px; color:var(--text); font:inherit; }
  /* hover: fondo appena più chiaro; focus: bordo azzurro di 2 px (≥ 3:1 su riga e pannello), mai il giallo della nave
     selezionata, così nessuna riga sembra «già scelta». Dentro la riga: il contenuto che scorre non lo taglia. */
  .pick .pickrow:hover { background:#1f2c3b; }
  .pick .pickrow:focus-visible { outline:2px solid #7cc4ff; outline-offset:-2px; }
  .pick .pickmore { color:var(--muted); text-align:center; }
  .pick .pickrow small { display:block; color:var(--muted); font-size:12px; margin-top:2px; }
  /* .leaflet-container davanti: più specifico del CSS di Leaflet (24 px), che può arrivare dopo questo */
  .leaflet-container .pick a.leaflet-popup-close-button { width:44px; height:44px; font:24px/44px system-ui, sans-serif; color:var(--muted); }
  .leaflet-container .pick a.leaflet-popup-close-button:hover,
  .leaflet-container .pick a.leaflet-popup-close-button:focus-visible { color:var(--accent); }
  #toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); z-index:2000; max-width:calc(100% - 32px);
    background:var(--panel); border:1px solid var(--accent); border-radius:10px; padding:12px 16px; font-size:14px; display:none;
    box-shadow:0 6px 24px rgba(0,0,0,.4); }
  #toast b { color:var(--accent); font-size:18px; letter-spacing:.5px; user-select:all; }
  @media (max-width: 640px) {
    header { left:56px; right:8px; flex-wrap:wrap; padding:6px 8px; gap:6px; }
    header b { font-size:15px; }
    header input { flex:1 1 140px; min-width:0; width:auto; }
    #status { flex-basis:100%; order:5; font-size:11px; }
    .hbtn { padding:5px 8px; font-size:13px; }
    #results { width:100%; max-width:none; }
    #results div { min-height:44px; padding:8px 12px; }   /* righe toccabili da almeno 44 px */
    #panel { top:auto; left:8px; right:8px; bottom:8px; width:auto; max-width:none; max-height:58vh; padding:14px; }
    #legend { left:8px; bottom:36px; max-width:calc(100% - 16px); max-height:50vh; overflow:auto; padding:0 12px; }
    #legend summary { min-height:44px; line-height:44px; padding:0; }   /* bersaglio da almeno 44 px */
    #legend[open] { padding-bottom:8px; }
    #toast { bottom:calc(58vh + 20px); }
  }
</style>
</head>
<body>
<div id="map"></div>
<header>
  <b>⚓ BoatRadar</b>
  <!-- punto 12: combobox con elenco dei risultati (frecce, Invio, Esc); aria-activedescendant = riga attiva -->
  <input id="q" placeholder="Cerca nome, MMSI, IMO o nominativo…" autocomplete="off" role="combobox" aria-autocomplete="list"
    aria-expanded="false" aria-controls="results" aria-label="Cerca una nave per nome, MMSI, IMO o nominativo radio">
  <div id="results" role="listbox" aria-label="Risultati della ricerca"></div>
  <span id="status">Caricamento…</span>
  <button id="registries" class="hbtn" title="Registri per trovare proprietari e armatori">📚 Registri</button>
  <button id="mode" class="hbtn" title="Passa alla mappa di VesselFinder">🌍 VesselFinder</button>
</header>
<iframe id="vf" title="Mappa VesselFinder"></iframe>
<div id="toast"></div>
<details id="legend" open>
  <summary>Legenda</summary>
  <div id="legend-types"></div>
  <div class="sym"><svg viewBox="-6 -9 12 16" aria-hidden="true"><path d="M0,-8L4.4,6L0,3.6L-4.4,6Z"/></svg>freccia = in moto</div>
  <!-- come symbol() di ais-logic.js: freccia corta quando la prua è nota e la nave non è in moto, cioè ferma
       (fino a 0,5 kn) o con la velocità non nota; «ferma» nel tooltip invece solo con la velocità nota (stopped) -->
  <div class="sym"><svg viewBox="-6 -9 12 16" aria-hidden="true"><path d="M0,-5.2L4.4,3.9L0,2.34L-4.4,3.9Z"/></svg>freccia corta = ferma o velocità non nota, prua nota</div>
  <div class="sym"><svg viewBox="-6 -9 12 16" aria-hidden="true"><circle r="4"/></svg>pallino = direzione non nota</div>
  <!-- punto 8: le navi sbiadiscono con l'età della posizione (bordo chiaro dopo 2 min); le ferme restano fino a 6 h,
       tratteggiate dopo 30 min -->
  <div class="sym"><svg viewBox="-6 -9 12 16" aria-hidden="true"><circle r="4" class="fading"/></svg>sbiadita, bordo chiaro = posizione di qualche minuto fa</div>
  <div class="sym"><svg viewBox="-6 -9 12 16" aria-hidden="true"><circle r="4" class="old"/></svg>sbiadita, tratteggiata = posizione vecchia (ferma)</div>
</details>
<aside id="panel"><button id="close" aria-label="Chiudi la scheda" title="Chiudi la scheda">×</button><div id="content"></div></aside>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="config.js"></script>
<script src="public/ais-logic.js"></script>
<script>
// Dati AIS live di tutto il mondo, raccolti da server.js tramite aisstream.io (solo l'area visibile).
// Dati AIS live del Baltico, aperti e senza chiave (Fintraffic / Digitraffic).
const BALTIC = 'https://meri.digitraffic.fi/api/ais/v1';
const REFRESH_MS = 15000;
// Baltico: solo navi viste negli ultimi 30 minuti. Resta 30 min anche dopo il punto 8 (navi ferme fino a 6 h in
// mappa): con 6 h la risposta di Digitraffic, che arriva intera a ogni giro, diventerebbe molto più pesante e non è
// stata misurata (Digitraffic non era raggiungibile dalla sessione di sviluppo). Nel Baltico le navi ferme da più
// di 30 min si vedono solo se arrivano anche da aisstream.
const WINDOW_MS = 30 * 60 * 1000;
const CLOCK_WAIT_MS = 3000;       // primo aggiornamento: attesa massima di /api/status prima di chiedere il Baltico
const API_TIMEOUT_MS = 8000;      // richieste al server del giro (vista, include=, /status): oltre, annullate
const BALTIC_TIMEOUT_MS = 15000;  // posizioni del Baltico (Digitraffic): oltre, annullate e il giro va avanti senza
const WAKE_TIMEOUT_MS = 45000;    // vista a Render che si sveglia (waking): Render tiene la richiesta finché non è pronto
const RETRY_SLACK_MS = 250;       // margine del tentativo dopo un errore, perché il timer non scatti prima dell'attesa
const API_KEY = 'boatradar:api';  // sessionStorage: server attivo, ricordato per la sessione della scheda
const PRIMARY_RECHECK_MS = 5 * 60 * 1000;   // su un server di riserva: ogni 5 min una prova leggera del primo

// Logica pura (tipi di nave, ETA, ricerca…) in public/ais-logic.js, provata da test/ais-logic.test.js.
// Se non è arrivato (rete, cache) lo dico nella riga di stato invece di fermarmi con un ReferenceError.
if (!window.AisLogic) {
  const msg = 'Errore: public/ais-logic.js non è stato caricato. Ricarica la pagina (Ctrl+F5 o trascina giù sul telefono).';
  document.getElementById('status').textContent = msg;
  throw new Error(msg);
}
const { TYPES, typeOf, typeName, validHeading, symbol, stopped, decodeEta, matchesQuery, SOURCE_LABEL, isNewer, mergeFeatures,
  clockSample, createClock, includeParam, toMs, ageStyle, formatAge, ageClass, DEFAULT_LIMITS, normLimits,
  apiList, createFailover, networkDown, validSog, pickRadius, canvasTolerance, nearbyMarkers, pickTouch, pickLimit, pickMaxHeight } = AisLogic;

// Server dei dati mondiali (punto 86). Su GitHub Pages config.js scrive l'elenco in window.BOATRADAR_APIS (prima la VM
// Oracle, poi Render che si addormenta); da server.js è lo stesso host ('/api'). Si passa al successivo solo quando la
// richiesta della vista sbaglia (errore di rete, risposta non ok, nessuna risposta entro API_TIMEOUT_MS), sulla VM
// due volte di fila, e mai quando manca la rete dell'utente (networkDown): un server che risponde non fa mai passare
// all'altro. Su un server di riserva, ogni PRIMARY_RECHECK_MS (o più, se la VM oscilla), subito ricaricando la scheda e
// quando la scheda torna visibile (se l'ultima prova è finita da almeno 60 s), la pagina prova il primo (recheckPrimary)
// e, se risponde, ci torna; con la scheda nascosta su un server di riserva i giri fanno solo questa prova: Render ha 5 GB
// al mese di traffico (deploy/README.md, «Passaggio automatico nella pagina»). Il server attivo resta per la sessione
// della scheda (sessionStorage, che in alcuni browser lancia: allora vale solo fino alla chiusura della pagina).
const API_LIST = apiList(window);
const backends = createFailover(API_LIST, {
  saved: (() => { try { return sessionStorage.getItem(API_KEY); } catch { return null; } })(),
  onChange: b => { try { sessionStorage.setItem(API_KEY, b.url); } catch { /* resta solo in memoria */ } },
  recheckMs: PRIMARY_RECHECK_MS,
});
const api = () => backends.current().url;
// «server di riserva (Render)»: il server attivo quando non è il primo dell'elenco
const backupName = (b = backends.current()) => 'server di riserva' + (b.name ? ` (${b.name})` : '');
let retryTimer = null;   // l'unico tentativo programmato dopo un errore del server
let balticOkAt = null;   // ultima risposta del Baltico (networkDown: il Baltico dice se la rete dell'utente c'è)
let firstRound = true, visibleAgain = false;   // giri in cui la prova del primo si fa subito e si aspetta
let wakeView = false;    // vista a Render in avvio in corso (fino a WAKE_TIMEOUT_MS): gli altri giri non ne aprono altre
                         // (rimesso a false dal finally della sua richiesta, worldRequests)

// Ora corretta con serverTime di /api/status (punto 43): un telefono con l'orologio sbagliato di qualche
// minuto non sposta età e finestre. Ogni calcolo con l'ora attuale usa clock.now(), non l'ora del telefono.
const clock = createClock();

const NAV_STATUS = ['In navigazione a motore','All\'ancora','Non governabile','Manovrabilità limitata','Limitata dal pescaggio',
  'Ormeggiata','Incagliata','In pesca','In navigazione a vela'];

  303:'USA (Alaska)',304:'Antigua e Barbuda',305:'Antigua e Barbuda',308:'Bahamas',309:'Bahamas',310:'Bermuda',311:'Bahamas',

const $ = id => document.getElementById(id);
const map = L.map('map', { preferCanvas:true, zoomControl:false, worldCopyJump:true }).setView([30, 10], 3);
// pulsanti di zoom con il nome in italiano (title e aria-label: Leaflet li mette in inglese)
L.control.zoom({ zoomInTitle: 'Ingrandisci', zoomOutTitle: 'Riduci' }).addTo(map);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 18, className: 'tiles', attribution: '© OpenStreetMap · AIS: aisstream.io, Fintraffic / digitraffic.fi (CC BY 4.0)'
}).addTo(map);
// Punto 10: schermo touch (dito, non mouse) → area toccabile più ampia: tolleranza del canvas (hover, tooltip) e raggio
// entro cui un tocco raccoglie le navi (pick)
const TOUCH = matchMedia('(pointer: coarse)').matches;
const renderer = L.canvas({ padding: 0.5, tolerance: canvasTolerance(TOUCH) });

// Freccia orientata sulla prua (o sulla rotta, se la prua manca e la nave è in moto). Prua nota e nave non in moto
// (ferma o velocità non nota): freccia corta (options.short). Senza direzione: pallino. Simbolo da symbol() di ais-logic.js.
const ShipMarker = L.CircleMarker.extend({
  setSymbol({ heading, short }) { this.options.heading = heading; this.options.short = short; return this.redraw(); },
  _updatePath() {
    const r = this._renderer, h = this.options.heading;
    if (h == null) return r._updateCircle(this);
    if (!r._drawing || this._empty()) return;
    const ctx = r._ctx, p = this._point, s = this.options.radius, k = this.options.short ? 0.65 : 1;
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(h * Math.PI / 180);
    ctx.beginPath();
    // freccia corta: stessa larghezza, lunghezza (prua-poppa) ridotta al 65%
    ctx.moveTo(0, -s * 2 * k); ctx.lineTo(s * 1.1, s * 1.5 * k); ctx.lineTo(0, s * 0.9 * k); ctx.lineTo(-s * 1.1, s * 1.5 * k);
    ctx.closePath();
    ctx.restore();
    r._fillStroke(ctx, this);
  },
});
new ResizeObserver(() => map.invalidateSize()).observe($('map'));

const meta = new Map();     // mmsi -> dati statici (nome, IMO, tipo…)
const markers = new Map();  // mmsi -> { marker, props }
let selected = null;
// ultime properties della nave selezionata (punto 8): la scheda resta aggiornata anche quando il marker manca (posizione
// scaduta, nave scelta dalla ricerca non ancora arrivata)
let selectedProps = null;
let worldTotal = 0;
// Limiti di conservazione del server (limits di /api/status, normLimits): valgono per le navi di aisstream; quelle del
// Baltico (Digitraffic) usano i limiti normali. Una risposta senza limiti validi riporta ai normali; se /api/status non
// risponde restano gli ultimi ricevuti.
let serverLimits = DEFAULT_LIMITS;
const limitsOf = p => (p?.source === 'digitraffic' ? DEFAULT_LIMITS : serverLimits);
const ageOf = (p, now = clock.now()) => ageStyle(p || {}, now, limitsOf(p));
// Bordo dei marker: normale e nave selezionata (giallo, più grande)
const STYLE = { normal: { radius:4, color:'#0b1118', weight:1 }, selected: { radius:8, color:'#ffc83d', weight:3 } };
// Punto 8: posizione più vecchia del limite delle navi in moto (solo le ferme restano in mappa così a lungo):
// bordo chiaro tratteggiato, perché il bordo normale scuro non si vedrebbe sulla mappa scura
const AGE_DASH = { color:'#c9d4e0', weight:1.5, dashArray:'3 2' };

// Opacità per età (dopo la revisione del QA): riempimento 0,95 appena ricevuta, poi segue fadeOpacity fino a 0,35 a
// 30 min; le ferme oltre 30 min (tratteggiate, con il bordo chiaro) 0,2. Il bordo scuro normale sulla mappa scura ha
// contrasto ~1:1, quindi una nave in moto che sbiadisce (oltre 2 min) prende un bordo chiaro pieno mai sotto lo 0,55:
// almeno 3:1 su terra, mare, bosco e mappa senza tile (con il filtro di .tiles; test in test/pagina-vm.test.js).
const FADE = { fill: 0.95, oldFill: 0.2, selectedFill: 0.6, border: '#c9d4e0', borderMin: 0.55 };

// Stile del marker: STYLE (normale o selezionata) combinato con l'età della posizione (ageOf: ora corretta e limiti
// della sua fonte). La nave selezionata tiene il bordo giallo pieno e il riempimento almeno al 60 %.
function markerStyle(props, sel, now = clock.now()) {
  const a = ageOf(props, now), fill = Math.min(FADE.fill, a.opacity);
  if (sel) return { ...STYLE.selected, opacity: 1, fillOpacity: Math.max(fill, FADE.selectedFill), dashArray: a.dashed ? '6 3' : null };
  if (a.dashed) return { ...STYLE.normal, ...AGE_DASH, opacity: 0.9, fillOpacity: FADE.oldFill };
  if (a.opacity < 1) return { ...STYLE.normal, color: FADE.border, opacity: Math.max(a.opacity, FADE.borderMin), fillOpacity: fill, dashArray: null };
  return { ...STYLE.normal, opacity: 1, fillOpacity: FADE.fill, dashArray: null };
}

// Età della posizione in parole, uguale in tooltip, scheda e ricerca: «12 min fa», oltre il limite delle navi in moto
// (tratteggiata) «posizione di 3 h fa», oltre la sua conservazione «posizione scaduta»; null senza orario
function ageWords(props, now = clock.now()) {
  const a = ageOf(props, now), age = formatAge(a.age);
  if (!age) return null;
  return a.gone ? 'posizione scaduta' : (a.dashed ? 'posizione di ' : '') + age;
}

// Per la scheda, con l'ora: «12 min fa (08:41:03)», «posizione di 3 h fa (05:41:03)», «posizione scaduta (ultima: 05:41:03)»
function ageText(props, now = clock.now()) {
  const words = ageWords(props, now);
  if (!words) return null;
  const time = new Date(toMs(props.timestampExternal)).toLocaleTimeString('it-IT');
  return ageOf(props, now).gone ? `posizione scaduta (ultima: ${time})` : `${words} (${time})`;
}

// Punto 62: pallino colorato dell'età (verde < 5 min, arancio < 15 min, rosso; rosso anche se scaduta), decorativo: il
// testo accanto dice sempre l'età, quindi per i lettori di schermo è nascosto. '' senza orario.
function ageDot(props, now = clock.now()) {
  const a = ageOf(props, now);
  return Number.isFinite(a.age) ? `<span class="age age-${a.gone ? 'rosso' : ageClass(a.age)}" aria-hidden="true"></span>` : '';
}

// Tooltip: nome, «ferma» e età (senza l'ora), calcolati quando compare
function tooltipText(mmsi) {
  const p = markers.get(mmsi)?.props || {}, words = ageWords(p);
  return (meta.get(mmsi)?.name || String(mmsi)) + (stopped(p) ? ' · ferma' : '') + (words ? ' · ' + words : '');
}

// Properties della posizione di una nave: dal marker, o le ultime della nave selezionata se il marker manca
const propsOf = mmsi => markers.get(mmsi)?.props || (mmsi === selected && selectedProps) || {};

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

$('legend-types').innerHTML = TYPES.map(t => `<div><span style="background:${t.color}"></span>${t.label}</div>`).join('');
// su telefono la legenda parte chiusa (resta il pulsante «Legenda»), così non copre la mappa
if (matchMedia('(max-width: 640px)').matches) $('legend').open = false;

async function loadDetail(mmsi) {
  const v = await fetch(`${api()}/vessel?mmsi=${mmsi}`).then(r => r.ok ? r.json() : null).catch(() => null);
  if (v) meta.set(mmsi, { ...meta.get(mmsi), ...v });
}

function viewBox() {
  const b = map.getBounds().pad(0.2);
  if (b.getEast() - b.getWest() >= 360) return '-180,-90,180,90';
  const lon = x => ((x + 180) % 360 + 360) % 360 - 180;
  return [lon(b.getWest()), Math.max(b.getSouth(), -90), lon(b.getEast()), Math.min(b.getNorth(), 90)].map(x => x.toFixed(3)).join(',');
}

async function loadBalticMeta() {
  const res = await fetch(`${BALTIC}/vessels`);
  if (!res.ok) throw new Error('vessels ' + res.status);
  for (const v of await res.json()) {
    const length = (v.referencePointA || 0) + (v.referencePointB || 0), width = (v.referencePointC || 0) + (v.referencePointD || 0);
    meta.set(v.mmsi, { ...v, draught: v.draught / 10, length: length || null, width: width || null,
      eta: decodeEta(v.eta), staticTs: v.timestamp });
  }
}

// Richiesta al server dei dati mondiali: senza risposta entro API_TIMEOUT_MS la annullo, così un server che non
// risponde conta come errore (punto 86) e il giro non resta appeso
// signal (facoltativo, punto 12): annullamento da fuori, per esempio una ricerca superata da una più nuova; allora
// l'errore resta l'AbortError del browser, non «nessuna risposta»
function fetchApi(url, timeoutMs = API_TIMEOUT_MS, signal = null) {
  // browser senza AbortController (Safari prima della 12.1): niente timeout, l'errore arriva quando arriva
  if (typeof AbortController !== 'function') return fetch(url);
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), timeoutMs), stop = () => ctl.abort();
  if (signal) { if (signal.aborted) ctl.abort(); else signal.addEventListener('abort', stop); }
  return fetch(url, { signal: ctl.signal })
    .catch(err => { throw signal?.aborted ? err : ctl.signal.aborted ? new Error(`nessuna risposta in ${timeoutMs / 1000} s`) : err; })
    .finally(() => { clearTimeout(timer); signal?.removeEventListener('abort', stop); });
}

// Posizioni di una fonte. setTotal: total della risposta = navi nella vista (solo per la richiesta della vista;
// quello di include= conta le navi incluse). get: fetchApi per il server, fetch per il Baltico. Errore senza risposta
// (rete, timeout): err.network = true (networkDown); con una risposta non ok: err.status.
async function fetchFc(url, get = fetch) {
  const res = await get(url).catch(err => { throw Object.assign(err instanceof Error ? err : new Error(String(err)), { network: true }); });
  if (!res.ok) throw Object.assign(new Error('locations ' + res.status), { status: res.status });
  return res.json();
}
// fc.total della vista = navi nella vista (worldTotal)
function viewFeatures(fc) {
  if (fc.total != null) worldTotal = fc.total;
  return fc.features;
}
async function features(url, setTotal = false, get = fetch) {
  const fc = await fetchFc(url, get);
  return setTotal ? viewFeatures(fc) : fc.features;
}

// Stato del server; misura anche lo scarto dell'orologio (inizio e fine della richiesta con l'ora del telefono)
async function loadStatus(server) {
  const t0 = Date.now();
  const res = await fetchApi(`${server}/status`);
  const t1 = Date.now();
  const st = await res.json();
  clock.add(clockSample(t0, t1, st?.serverTime));
  return st;
}

// Orologio pronto: si risolve al primo /api/status del primo giro, o dopo CLOCK_WAIT_MS se il server non risponde
// (poi si va avanti con l'ora del telefono). Creata al primo giro, poi è già risolta.
let clockReady = null;

// Ritorno al server principale (punto 86): su un server di riserva, ogni PRIMARY_RECHECK_MS (raddoppiato se la VM
// oscilla, createFailover) una sola richiesta al primo della stessa vista del giro (/locations?bbox=…, uguale per tutti
// e servita dalla cache della VM; timeout API_TIMEOUT_MS), anche con la scheda nascosta (una risposta ogni 5 min). Di
// solito a parte dal giro: non tocca vista, orologio né riga di stato. Risposta ok con un elenco di navi → dal giro dopo
// si torna al primo; un elenco vuoto vale solo se anche /status del primo dice chiave e connessione ad aisstream (una
// VM appena ripartita, o senza chiave, risponde con zero navi): una richiesta in più solo in quel caso. Altrimenti si
// resta e si riprova dopo un intervallo, senza contarlo come errore del server attivo.
// urgent (primo giro dopo il caricamento, scheda tornata visibile): la prova parte subito e il giro la aspetta prima
// della vista, così se la VM risponde la vista va già alla VM e usa la risposta della prova (niente doppio download).
// Restituisce la prova in corso, che si risolve con { url, fc } se è andata bene, altrimenti con null.
let probe = null, probeUrgent = false;
function recheckPrimary(box, urgent) {
  if (!probe && backends.shouldRecheck(clock.now(), urgent)) {
    const url = API_LIST[0].url, viewUrl = `${url}/locations?bbox=${box}`;
    probeUrgent = urgent;
    probe = fetchFc(viewUrl, fetchApi)
      .then(async fc => {
        if (!Array.isArray(fc?.features)) return null;
        if (fc.features.length) return fc;
        const st = await fetchApi(`${url}/status`).then(res => (res.ok ? res.json() : null));
        return st?.hasKey && st?.connected ? fc : null;
      })
      .catch(() => null)
      .then(fc => {
        if (fc) backends.recheckOk(url, clock.now()); else backends.recheckFailed(clock.now());
        probe = null; probeUrgent = false;
        return fc ? { url: viewUrl, fc } : null;
      });
  }
  return probe || Promise.resolve(null);
}

// Scheda di nuovo visibile su un server di riserva: subito un giro con la prova del primo (il telefono può essere stato
// in tasca per ore mentre la VM tornava)
document.addEventListener('visibilitychange', () => {
  if (document.hidden || backends.current() === API_LIST[0]) return;
  visibleAgain = true;
  tick();
});

// Rete tornata (evento online): dopo errori della rete dell'utente, che non contano e aspettano sempre di più (fino a
// 60 s), la pagina riprova subito invece di aspettare il tentativo programmato
window.addEventListener('online', () => {
  if (backends.networkBack(clock.now())) { clearTimeout(retryTimer); retryTimer = null; }
  tick();
});

// Richieste al server attivo di un giro: vista, include= e /status, tutte a lui. Dopo un errore, fino al tentativo
// programmato (retryTimer), i giri chiedono solo il Baltico; così anche mentre una vista a Render in avvio aspetta
// (wakeView). probed: risposta della prova urgente appena riuscita, usata come vista se è la stessa richiesta. Le attese
// si contano con clock.now() (la regola di test/ais-logic.test.js vuole l'ora del telefono solo per misurare /api/status).
function worldRequests(probed) {
  const server = api(), waking = backends.waking(), world = backends.canTry(clock.now()) && !(waking && wakeView);
  const viewUrl = `${server}/locations?bbox=${viewBox()}`;
  const skipped = () => { const p = Promise.reject(new Error('server non raggiungibile')); p.catch(() => {}); return p; };
  // vista: uguale per tutti gli utenti, servita dalla cache del server; la nave selezionata (scheda aperta) a parte con
  // include=, fuori dalla cache, così resta in mappa ed è aggiornata anche lontano dalla vista
  const ship = selected && $('panel').style.display === 'block' ? includeParam([selected]) : '';
  let view;
  if (!world) view = skipped();
  else if (probed?.url === viewUrl) view = Promise.resolve(probed.fc).then(viewFeatures);
  else if (waking) {   // Render in avvio: la vista ha WAKE_TIMEOUT_MS (Render la tiene finché non è pronto), una alla volta
    wakeView = true;
    view = features(viewUrl, true, u => fetchApi(u, WAKE_TIMEOUT_MS)).finally(() => { wakeView = false; });
  } else view = features(viewUrl, true, fetchApi);
  return { server, world, view,
    inc: !ship ? Promise.resolve([]) : world ? features(`${server}/locations?${ship}`, false, fetchApi) : skipped(),
    status: world ? loadStatus(server) : Promise.resolve(null) };
}

async function loadLocations() {
  const urgent = firstRound || visibleAgain;
  firstRound = visibleAgain = false;
  const probing = recheckPrimary(viewBox(), urgent);
  // scheda nascosta su un server di riserva (quota di Render): nessuna richiesta del giro, solo la prova del primo;
  // la mappa resta com'era e alla riapertura (visibilitychange) riparte subito un giro
  if (document.hidden && api() !== API_LIST[0].url) return;
  // la prova urgente si aspetta solo prima delle richieste al server (punto 86): Baltico e attesa dell'orologio partono
  // subito. Il Baltico aspetta l'orologio (al massimo CLOCK_WAIT_MS dal primo giro), perché from= va calcolato con l'ora
  // corretta (anche un tick() chiamato durante l'attesa del primo giro aspetta la stessa promessa)
  const worldPart = (urgent || probeUrgent ? probing : Promise.resolve(null)).then(worldRequests);
  const status = worldPart.then(w => w.status);
  status.catch(() => {});      // l'esito lo legge allSettled qui sotto
  if (!clockReady) clockReady = Promise.race([status.catch(() => {}), new Promise(r => setTimeout(r, CLOCK_WAIT_MS))]);
  const balticGet = u => fetchApi(u, BALTIC_TIMEOUT_MS);
  const balticReq = clockReady.then(() => features(`${BALTIC}/locations?from=${clock.now() - WINDOW_MS}`, false, balticGet));
  balticReq.catch(() => {});   // idem; e se worldPart lancia, l'errore del Baltico non resta senza gestione
  const { server, world, view, inc: incReq } = await worldPart;
  const [med, inc, baltic, statusResult] = await Promise.allSettled([view, incReq, balticReq, status]);
  // solo la richiesta della vista decide il passaggio a un altro server; dopo un errore un solo tentativo programmato.
  // Senza rete dalla parte dell'utente (offline, o anche il Baltico fallito con errore di rete) l'errore non conta.
  if (world && med.status === 'fulfilled') backends.ok(server, clock.now());
  else if (world) {
    const down = networkDown({ onLine: navigator.onLine, viewNetwork: med.reason?.network === true,
      balticNetwork: baltic.status === 'rejected' && baltic.reason?.network === true, balticOkAt, t: clock.now() });
    backends.fail(server, clock.now(), { counts: !down });
    clearTimeout(retryTimer);
    retryTimer = setTimeout(tick, backends.retryIn(clock.now()) + RETRY_SLACK_MS);
  }
  if (baltic.status === 'fulfilled') balticOkAt = clock.now();
  if (med.status === 'rejected' && baltic.status === 'rejected') throw med.reason;
  const st = statusResult.status === 'fulfilled' ? statusResult.value : null;
  if (st) serverLimits = normLimits(st.limits);
  // stessa nave in più fonti: tengo la posizione più recente (properties.source dice da dove viene); la nave
  // inclusa vince sulla vista (forse dalla cache) se è più recente
  const merged = mergeFeatures([{ source: 'digitraffic', features: baltic.value }, { source: 'aisstream', features: med.value }, { source: 'aisstream', features: inc.value }]);
  // età con l'ora corretta (punto 8): una posizione oltre il suo limite (in moto 30 min, ferma 6 h, o i limiti del
  // server) non entra in mappa
  const now = clock.now();
  for (const [mmsi, f] of merged) {
    if (ageOf(f.properties, now).gone) continue;
    const [lon, lat] = f.geometry.coordinates;
    const { name, shipType } = f.properties;
    if (name || shipType != null) meta.set(mmsi, { ...meta.get(mmsi), ...(name && { name }), ...(shipType != null && { shipType }) });
    const color = typeOf(meta.get(mmsi)?.shipType).color;
    let m = markers.get(mmsi);
    // posizione più vecchia di quella già in mappa (es. l'altra fonte è in ritardo): il marker resta dov'è
    if (m && isNewer(m.props?.timestampExternal, f.properties.timestampExternal)) continue;
    if (!m) {
      // la nave selezionata (es. scelta dalla ricerca, arrivata con include=) nasce già con il bordo giallo
      const sel = mmsi === selected;
      const marker = new ShipMarker([lat, lon], { renderer, ...markerStyle(f.properties, sel, now), fillColor:color,
        ...symbol(f.properties) }).addTo(map);   // clic: map.on('click') → pick (punto 10)
      if (sel) marker.bringToFront();
      marker.bindTooltip(() => tooltipText(mmsi), { direction:'top' });
      m = { marker };
      markers.set(mmsi, m);
    } else {
      m.marker.setLatLng([lat, lon]);
      m.marker.setSymbol(symbol(f.properties));   // colore, opacità e tratteggio dopo il ciclo, con un solo setStyle
    }
    m.props = f.properties;
  }
  // se è fallita la richiesta include=, la nave selezionata non è sparita: manca solo la risposta, resta dov'è
  // (ma non oltre il limite della sua posizione). Ogni marker rimasto prende lo stile della sua età di adesso,
  // anche se in questo giro non si è spostato (un solo setStyle per marker: colore del tipo e stile dell'età).
  const keep = inc.status === 'rejected' ? selected : null;
  for (const [mmsi, m] of markers) {
    if (mmsi === selected) selectedProps = m.props;   // la scheda le tiene anche se il marker sparisce
    if ((!merged.has(mmsi) && mmsi !== keep) || ageOf(m.props, now).gone) { m.marker.remove(); markers.delete(mmsi); }
    else m.marker.setStyle({ ...markerStyle(m.props, mmsi === selected, now), fillColor: typeOf(meta.get(mmsi)?.shipType).color });
  }
  // riga di stato (punto 86): vista non riuscita → server in avvio, prossimo server provato subito, o attesa prima di
  // riprovare; vista riuscita → stato del server, e «server di riserva (Render)» se non è il primo dell'elenco
  // fromBackup: i dati del giro vengono da un server di riserva (la prova del primo può essere finita nel frattempo)
  const t = clock.now(), primary = backends.current() === API_LIST[0], fromBackup = server !== API_LIST[0].url;
  const note = med.status === 'rejected'
    ? (backends.waking() ? ` · Mondo: ${primary ? 'server' : 'server di riserva'} in avvio, circa un minuto…`
      : backends.canTry(t) ? ` · Mondo: provo il ${primary ? 'server principale' : backupName()}…`
      : ` · Mondo: server non raggiungibile, riprovo tra ${Math.ceil(backends.retryIn(t) / 1000)} s (ora solo Baltico)`)
    : (!st ? ' · Mondo: server non raggiungibile (ora solo Baltico)'
      : !st.hasKey ? ' · Mondo: manca la chiave gratuita di aisstream.io in aisstream-key.txt (ora solo Baltico)'
      : st.error ? ' · Mondo: ' + st.error
      : !st.connected ? ' · Mondo: connessione…'
      : ` · ${st.vessels} nel mondo` + (worldTotal > markers.size ? ' (zoom per vederle tutte)' : '')
        + (st.compression?.confirmed === false || (st.compression?.confirmed == null && st.compression?.negotiated === false)
          ? ' · Mondo: connessione non compressa, alcuni messaggi possono essere scartati' : ''))
      + (fromBackup ? ' · ' + backupName(API_LIST.find(b => b.url === server)) : '');
  $('status').textContent = `${markers.size} in mappa · agg. ${new Date(clock.now()).toLocaleTimeString('it-IT')}${note}`;
  // dati statici della nave aperta non ancora arrivati: li richiedo a ogni aggiornamento finché ci sono
  if (selected && !meta.get(selected)?.staticTs) await loadDetail(selected);
  // scheda aggiornata a ogni giro (età), anche senza marker: con le ultime properties dice «posizione scaduta»
  if (selected) render(selected);
}

// Nessuna nave scelta: tolgo il bordo giallo; senza selected la pagina non chiede più la nave con include=
function deselect() {
  if (selected && markers.has(selected)) markers.get(selected).marker.setStyle(markerStyle(markers.get(selected).props, false));
  selected = null;
  selectedProps = null;
}

// Scheda aperta e chiusa. La classe panel-open tiene l'header fuori dalla scheda su desktop (CSS). Alla chiusura il
// focus torna dove la scheda era stata aperta (pulsante, mappa) se è ancora visibile, altrimenti sul campo di ricerca:
// senza, chi usa la tastiera lo perderebbe sulla × nascosta.
let opener = null;
function openPanel() {
  if ($('panel').style.display !== 'block') opener = document.activeElement;
  $('panel').style.display = 'block';
  document.body.classList.add('panel-open');
}
function closePanel() {
  deselect();
  $('panel').style.display = 'none';
  document.body.classList.remove('panel-open');
  const back = opener && opener !== document.body && opener.isConnected && opener.getClientRects().length ? opener : $('q');
  opener = null;
  back.focus();
}

// props: posizione nota se la nave non ha (ancora) un marker, es. un risultato di ricerca del server
function select(mmsi, props) {
  deselect();
  selected = mmsi;
  const m = markers.get(mmsi);
  selectedProps = m?.props || props || null;
  if (m) { m.marker.setStyle(markerStyle(m.props, true)).bringToFront(); }
  render(mmsi);
  openPanel();
  if (!meta.get(mmsi)?.staticTs) loadDetail(mmsi).then(() => selected === mmsi && render(mmsi));
}

// Punto 10: scelta della nave toccata. Un clic sulla mappa (anche sopra un marker: Leaflet lo passa alla mappa) raccoglie
// le navi entro pickRadius dal punto del mouse o del dito (non dal centro del marker, che Leaflet mette in containerPoint):
// nessuna → niente; una → scheda; più di una → popup «N navi qui» con una riga (pulsante da almeno 44 px) per nave.
// Si proiettano solo i marker nella vista, più il raggio. Raggio: quello del dito se il clic viene da un dito
// (pointerType dell'evento; senza, il tipo di schermo), e per ogni marker almeno il doppio del suo simbolo (la nave
// selezionata ha raggio 8: la punta della freccia è a 16 px dal centro). Durante l'animazione dello zoom i marker non
// sono dove le proiezioni li mettono: niente scelta.
let pickPopup = null, pickOpener = null, pickCenter = null, pickSeq = 0;
function pick(point, touch = TOUCH) {
  if (map._animatingZoom) return;
  const r = pickRadius(touch), size = map.getSize(), items = [];
  for (const [mmsi, m] of markers) {
    const p = map.latLngToContainerPoint(m.marker.getLatLng()), mr = Math.max(r, (m.marker.options.radius || 0) * 2);
    if (p.x >= -mr && p.y >= -mr && p.x <= size.x + mr && p.y <= size.y + mr) items.push({ mmsi, x: p.x, y: p.y, r: mr });
  }
  const near = nearbyMarkers(point, items, r);
  if (near.length === 1) select(near[0].mmsi);
  else if (near.length > 1) openPick(point, near.map(n => n.mmsi));
}
map.on('click', e => pick(e.originalEvent ? map.mouseEventToContainerPoint(e.originalEvent) : e.containerPoint,
  pickTouch(e.originalEvent, TOUCH)));

// Riga del popup: NOME, poi «tipo · 12,3 kn · MMSI …» (n.d. per i dati mancanti; l'MMSI distingue le navi omonime)
function pickRow(mmsi) {
  const v = meta.get(mmsi) || {}, p = propsOf(mmsi);
  const type = v.shipType != null ? typeName(v.shipType) || typeOf(v.shipType).label : 'tipo n.d.';
  const sog = validSog(p.sog) ? p.sog.toFixed(1).replace('.', ',') + ' kn' : 'velocità n.d.';
  return `<button type="button" class="pickrow" data-pick="${mmsi}"><b>${esc(v.name || 'Senza nome')}</b>`
    + `<small>${esc(`${type} · ${sog} · MMSI ${mmsi}`)}</small></button>`;
}

// Margini dell'autoPan: il popup resta sotto l'header e fuori dalla scheda aperta (a destra su desktop, in basso sul
// telefono), così non si apre una riga coperta. maxHeight: altezza del contenuto che ci sta davvero fra il fondo
// dell'header e la cima della scheda (telefono) o il fondo della mappa (pickMaxHeight, almeno ~3 righe: oltre scorre).
function pickPadding() {
  const m = $('map').getBoundingClientRect(), h = document.querySelector('header').getBoundingClientRect();
  const top = Math.max(0, h.bottom - m.top), topLeft = [10, Math.max(10, Math.round(top) + 10)];
  const height = m.bottom - m.top;
  if ($('panel').style.display !== 'block') return { topLeft, bottomRight: [10, 10], maxHeight: pickMaxHeight({ top, bottom: height }) };
  const p = $('panel').getBoundingClientRect();
  if (!matchMedia('(max-width: 640px)').matches)
    return { topLeft, bottomRight: [Math.max(10, Math.round(m.right - p.left) + 10), 10], maxHeight: pickMaxHeight({ top, bottom: height }) };
  return { topLeft, bottomRight: [10, Math.max(10, Math.round(m.bottom - p.top) + 10)],
    maxHeight: pickMaxHeight({ top, bottom: Math.min(height, p.top - m.top) }) };
}

// list: MMSI dalla più vicina; al massimo PICK_MAX_ROWS righe, poi «e altre N: avvicina la mappa» (zoom + 2 sul punto)
function openPick(point, list) {
  // prima chiudo un popup aperto (il suo popupclose vede ancora il vecchio pickPopup e rimette il focus dov'era prima),
  // poi prendo l'origine del focus, assegno e apro: popupopen riconosce il popup nuovo
  map.closePopup();
  pickOpener = document.activeElement;
  const pad = pickPadding(), { shown, more } = pickLimit(list), id = `pick-title-${++pickSeq}`;
  pickCenter = map.containerPointToLatLng(point);
  pickPopup = L.popup({ className: 'pick', minWidth: 220, maxWidth: 320, maxHeight: pad.maxHeight,
    autoPanPaddingTopLeft: pad.topLeft, autoPanPaddingBottomRight: pad.bottomRight })
    .setLatLng(pickCenter)
    .setContent(`<div class="pick-list" role="group" aria-labelledby="${id}"><p class="pick-title" id="${id}">${list.length} navi qui</p>`
      + shown.map(pickRow).join('')
      + (more ? `<button type="button" class="pickrow pickmore" data-more="${more}">e altre ${more}: avvicina la mappa</button>` : '')
      + '</div>');
  pickPopup.openOn(map);
}

// Popup aperto: delega del clic sulle righe (l'elemento è nuovo per ogni popup) e focus sulla prima riga, per tastiera e
// lettori di schermo. Riga scelta → popup chiuso e scheda della nave.
map.on('popupopen', e => {
  if (e.popup !== pickPopup) return;
  const el = e.popup.getElement();
  el.addEventListener('click', ev => {
    const row = ev.target.closest('[data-pick]');
    if (row) { map.closePopup(); select(Number(row.dataset.pick)); return; }
    if (!ev.target.closest('[data-more]')) return;
    const center = pickCenter;
    map.closePopup();
    map.setView(center, map.getZoom() + 2);
  });
  el.querySelector('.leaflet-popup-close-button')?.setAttribute('aria-label', 'Chiudi elenco');
  el.querySelector('.pickrow')?.focus();
  // il tooltip della nave sotto il puntatore spunterebbe da sotto il popup
  for (const m of markers.values()) m.marker.closeTooltip();
});
// Popup chiuso (Esc, ×, riga scelta, clic altrove): se il focus era nel popup torna dove era prima (di solito la mappa)
map.on('popupclose', e => {
  if (e.popup !== pickPopup) return;
  const el = e.popup.getElement(), active = document.activeElement, opener = pickOpener;
  pickPopup = null;
  pickOpener = null;
  pickCenter = null;
  if (active && active !== document.body && !el.contains(active)) return;
  const back = opener && opener !== document.body && opener.isConnected && opener.getClientRects().length ? opener : $('map');
  back.focus();
});
// Esc con il popup aperto e il focus nel popup, sulla mappa o da nessuna parte (body) chiude solo il popup (prima di
// Leaflet e degli altri Esc). Con il focus altrove (ricerca, scheda) Esc fa il suo lavoro lì: chiude i risultati o la scheda.
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape' || !pickPopup) return;
  const a = document.activeElement;
  if (a && a !== document.body && !$('map').contains(a) && !pickPopup.getElement()?.contains(a)) return;
  e.preventDefault();
  e.stopPropagation();
  map.closePopup();
}, true);

// Proprietario annotato dall'utente, ricordato per ogni nave in questo browser
function savedOwner(mmsi) { try { return localStorage.getItem('owner:' + mmsi) || ''; } catch { return ''; } }
function saveOwner(mmsi, name) {
  try { name ? localStorage.setItem('owner:' + mmsi, name) : localStorage.removeItem('owner:' + mmsi); } catch {}
}

function facts(mmsi) {
  const v = meta.get(mmsi) || {};
  const p = propsOf(mmsi);
  const imo = v.imo && v.imo > 0 ? v.imo : null;
  const two = n => String(n).padStart(2, '0');
  const MONTHS = ['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
  const eta = v.eta ? `${two(v.eta.day)} ${MONTHS[v.eta.month - 1]}` + (v.eta.hour != null ? `, ${two(v.eta.hour)}:${two(v.eta.minute ?? 0)} UTC` : '') : null;
  const sog = p.sog != null && p.sog < 102.3 ? p.sog.toFixed(1) + ' kn' : null;
  const cog = p.cog != null && p.cog < 360 ? p.cog.toFixed(1) + '°' : null;
  const hdg = validHeading(p.heading);
  const row = (k, val) => `<tr><td>${k}</td><td>${esc(val == null || val === '' ? '—' : val)}</td></tr>`;
  const waiting = !v.staticTs && !imo && !v.callSign && v.shipType == null;
  return `
      ${savedOwner(mmsi) ? `<tr class="owned"><td>Proprietario</td><td>${esc(savedOwner(mmsi))}</td></tr>` : ''}
      ${waiting ? '<tr><td colspan="2" class="wait">Tipo, IMO, dimensioni e porto di arrivo non sono ancora arrivati: le navi li trasmettono ogni 6 minuti, la scheda si completa da sola.</td></tr>' : ''}
      ${row('Tipo', typeName(v.shipType) || typeOf(v.shipType).label)}
      ${row('Bandiera', MID[String(mmsi).slice(0, 3)])}
      ${row('IMO', imo)}
      ${row('MMSI', mmsi)}
      ${row('Nominativo', v.callSign)}
      ${row('Prossimo porto', v.destination)}
      ${row('ETA', eta)}
      ${row('Velocità / Rotta', sog || cog ? `${sog || '—'} / ${cog || '—'}` : null)}
      ${row('Prua', hdg != null ? hdg + '°' : null)}
      ${row('Stato', NAV_STATUS[p.navStat])}
      ${row('Dimensioni', v.length ? `${v.length} × ${v.width || '—'} m` : null)}
      ${row('Pescaggio', v.draught ? v.draught.toFixed(1) + ' m' : null)}
      <tr><td>Ultimo segnale</td><td>${ageText(p) ? ageDot(p) + esc(ageText(p)) : '—'}</td></tr>
      ${row('Fonte', SOURCE_LABEL[p.source])}`;
}

function render(mmsi) {
  // Aggiornamento periodico della stessa nave: rinnovo solo i dati, senza toccare campo e sezioni aperte
  if ($('content').dataset.mmsi === String(mmsi) && $('facts')) {
    const v = meta.get(mmsi) || {};
    const known = v.imo > 0 ? 'imo' : '';
    // se nel frattempo sono arrivati i dati statici (IMO, tipo) rifaccio la scheda, conservando il nome annotato
    if ($('content').dataset.known === known) { $('facts').innerHTML = facts(mmsi); return; }
  }
  const v = meta.get(mmsi) || {};
  const flag = MID[String(mmsi).slice(0, 3)] || '—';
  const imo = v.imo && v.imo > 0 ? v.imo : null;
  const ids = { IMO: imo, MMSI: mmsi, Nome: v.name };
  const yacht = v.shipType === 36 || v.shipType === 37 || !imo;
  const italian = String(mmsi).startsWith('247');
  const group = (title, keys, open = false) => `<details${open ? ' open' : ''}><summary>${esc(title)}</summary>
      ${keys.map(k => registryButton(k, ids)).join('')}</details>`;
  $('content').dataset.mmsi = mmsi;
  $('content').dataset.known = imo ? 'imo' : '';
  $('content').innerHTML = `
    <h2>${esc(v.name || 'Senza nome')}</h2>
    <div class="sub" id="sub">${esc(typeName(v.shipType) || typeOf(v.shipType).label)} · bandiera ${esc(flag)}</div>
    <table id="facts">${facts(mmsi)}</table>
    <a class="link vfmore" target="_blank" rel="noopener" href="https://www.vesselfinder.com/vessels/details/${imo || mmsi}">📷 Foto, stazza, anno di costruzione e porti
      <small>Dati che il segnale AIS non trasmette: scheda completa su VesselFinder</small></a>

    <h3>Chi è il proprietario?</h3>
    <div class="step"><span>1</span> Apri il registro: il numero viene copiato, tu lo incolli nella ricerca.</div>
    <button class="owner" data-registry="${imo ? 'equasis' : 'itu'}" data-id="${imo || mmsi}">🔎 Trova il proprietario
      <small>${imo ? 'Equasis con l\'IMO ' + imo + ' già copiato' : 'ITU MARS con l\'MMSI ' + mmsi + ' già copiato'}</small></button>
    ${imo ? registryButton('itu', ids) : ''}

    <div class="step"><span>2</span> Incolla qui il nome del proprietario: resta salvato su questa nave.</div>
    <input id="company" placeholder="Es. HUNDORP SHIPPING INC" value="${esc(savedOwner(mmsi))}" autocomplete="off">

    <div class="step"><span>3</span> Scopri chi c'è dietro la società, con un clic:</div>
    <div class="chips">${Object.keys(COMPANY_SEARCH).map(k => `<button class="chip" data-company="${k}">${esc(COMPANY_SEARCH[k].name)}</button>`).join('')}</div>

    <h3>Altre fonti</h3>
    ${yacht ? group('Yacht e barche da diporto', ['superyachtfan', 'superyachttimes', 'googleyacht'], true) : ''}
    ${italian ? group('Barca italiana', ['sted', 'guardiacostiera'], yacht) : ''}
    ${imo ? group('Società di classificazione', ['lr', 'dnv', 'abs', 'classnk', 'bv', 'rina']) : ''}
    <details><summary>Mappe e schede nave</summary>
      <button class="link" data-show-vf="${mmsi}">Mostra sulla mappa VesselFinder
        <small>Posizione e rotta secondo VesselFinder</small></button>
      <a class="link" target="_blank" rel="noopener" href="https://www.vesselfinder.com/vessels/details/${imo || mmsi}">VesselFinder
        <small>Scheda nave, foto, porto di partenza e arrivo</small></a>
      <a class="link" target="_blank" rel="noopener" href="https://www.marinetraffic.com/en/ais/details/ships/mmsi:${mmsi}">MarineTraffic
        <small>Scheda nave, foto, storico scali</small></a></details>
    ${group('Servizi a pagamento (armatore e gruppo già pronti)', ['seaweb', 'clarksons', 'kpler', 'vfpro', 'datalastic'])}
    ${!italian ? group('Barche da diporto in Italia', ['sted', 'guardiacostiera']) : ''}`;
}

function registryButton(key, ids = {}) {
  const r = REGISTRY[key], id = r.copy ? ids[r.copy] : '';
  if (r.search && id) return `<a class="link" target="_blank" rel="noopener" href="${esc(r.search(id))}">${esc(r.name)}
    <small>Cerca «${esc(id)}» · ${esc(r.desc)}</small></a>`;
  return `<button class="link" data-registry="${key}" data-id="${esc(r.search ? '' : id || '')}">${esc(r.name)}
    <small>${id ? r.copy + ' ' + esc(id) + ' · ' : ''}${esc(r.desc)}</small></button>`;
}

function registryList(ids = {}) {
  return Object.entries(REGISTRY_GROUPS).map(([group, title]) => {
    const keys = Object.keys(REGISTRY).filter(k => REGISTRY[k].group === group);
    return `<h3>${esc(title)}</h3>` + keys.map(k => registryButton(k, ids)).join('');
  }).join('');
}

function copyAndTell(label, id, how = '') {
  const show = copied => toast(`${esc(label)} <b>${esc(id)}</b> ${copied ? 'copiato.' : '(selezionalo e copialo).'} ${how}`);
  if (navigator.clipboard) navigator.clipboard.writeText(String(id)).then(() => show(true), () => show(false));
  else show(false);
}

// Il nome del proprietario si salva mentre lo scrivi e compare in cima alla scheda
$('content').addEventListener('input', e => {
  if (e.target.id !== 'company' || !selected) return;
  saveOwner(selected, e.target.value.trim());
  $('facts').innerHTML = facts(selected);
});

let toastTimer;
function toast(html) {
  $('toast').innerHTML = html;
  $('toast').style.display = 'block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { $('toast').style.display = 'none'; }, 15000);
}
$('toast').onclick = () => { $('toast').style.display = 'none'; };

$('content').addEventListener('click', e => {
  const reg = e.target.closest('[data-registry]');
  if (reg) {
    const r = REGISTRY[reg.dataset.registry], id = reg.dataset.id;
    window.open(r.url, '_blank', 'noopener');
    if (id) copyAndTell(r.copy, id, r.how);
    return;
  }
  const chip = e.target.closest('[data-company]');
  if (chip) {
    const name = $('company').value.trim();
    if (!name) {
      $('company').focus();
      return toast('Prima incolla nel campo <b>2</b> il nome del proprietario trovato nel registro.');
    }
    const c = COMPANY_SEARCH[chip.dataset.company];
    window.open(c.url(name), '_blank', 'noopener');
    if (c.copy) copyAndTell('Nome', name, 'Incollalo nel campo di ricerca del sito.');
    return;
  }
  const vf = e.target.closest('[data-show-vf]');
  if (vf) setMode(true, Number(vf.dataset.showVf));
});

// Seconda mappa: VesselFinder, centrata dove si trova la nostra (o sulla nave scelta)
function setMode(vesselFinder, mmsi) {
  document.body.classList.toggle('vf', vesselFinder);
  $('mode').textContent = vesselFinder ? '⚓ Mappa BoatRadar' : '🌍 VesselFinder';
  $('mode').title = vesselFinder ? 'Torna alla mappa di BoatRadar' : 'Passa alla mappa di VesselFinder';
  if (!vesselFinder) return;
  const pos = mmsi && markers.get(mmsi)?.marker.getLatLng();
  const c = pos || map.getCenter();
  const zoom = pos ? Math.max(map.getZoom(), 10) : map.getZoom();
  const params = new URLSearchParams({ lat: c.lat.toFixed(4), lon: L.Util.wrapNum(c.lng, [-180, 180], true).toFixed(4),
    zoom: Math.max(3, zoom) });
  if (mmsi) params.set('mmsi', mmsi);
  $('vf').src = 'vesselfinder.html?' + params;
}
$('mode').onclick = () => setMode(!document.body.classList.contains('vf'));
$('registries').onclick = () => { setMode(false); showRegistries(); };

// --- Ricerca (punto 12) ---------------------------------------------------------------------------------------------
// Ordine e punteggio come /api/search (searchScore, compareSearch di ais-logic.js). La richiesta parte SEARCH_WAIT_MS
// dopo l'ultimo tasto e va al server attivo (api(), punto 86) con il timeout di fetchApi; un tasto nuovo annulla quella
// in corso (AbortController: l'annullamento non è un errore). Ai risultati del server si uniscono le navi in mappa (per
// esempio quelle del Baltico), le prime SEARCH_MAX. Righe role="option" (id res-<mmsi>) con nome, MMSI, resultLine e
// «N navi con questo nome»; frecce, Invio (riga attiva, altrimenti la prima) ed Esc dal campo (#q, combobox).
const { norm, searchScore, compareSearch, homonymCounts, resultLine } = AisLogic;
const SEARCH_WAIT_MS = 250, SEARCH_MAX = 25;
const found = new Map(); // mmsi -> [lat, lon] dei risultati di ricerca
const foundProps = new Map(); // mmsi -> properties della posizione (orario, velocità, stato) dei risultati
let searchTimer = null, searchCtl = null, searchSeq = 0;
let searchHits = [], searchActive = -1;   // risultati mostrati ({ mmsi, props, score, ts }) e riga attiva (-1 = nessuna)

function showResults() { $('results').style.display = 'block'; $('q').setAttribute('aria-expanded', 'true'); }
function hideResults() {
  $('results').style.display = 'none';
  $('q').setAttribute('aria-expanded', 'false');
  $('q').removeAttribute('aria-activedescendant');
  if (searchActive >= 0) { searchActive = -1; renderResults(); }
}

// Elenco dei risultati con l'età all'ora corretta (clock.now()) e le stesse parole di tooltip e scheda (ageWords): un
// risultato del server che la pagina considera scaduto resta nell'elenco come «posizione scaduta»
function renderResults() {
  const box = $('results'), now = clock.now();
  if (!searchHits.length) {
    box.innerHTML = '<div class="none" role="option" aria-disabled="true" aria-selected="false">Nessun risultato</div>';
    return;
  }
  const counts = homonymCounts(searchHits.map(h => meta.get(h.mmsi) || {}));
  box.innerHTML = searchHits.map((h, i) => {
    const v = meta.get(h.mmsi) || {}, twins = counts.get(norm(v.name)) || 0;
    const line = resultLine({ typeName: typeName(v.shipType), flag: MID[String(h.mmsi).slice(0, 3)], length: v.length,
      age: ageWords(h.props, now), destination: v.destination });
    return `<div role="option" id="res-${h.mmsi}" data-mmsi="${h.mmsi}" aria-selected="${i === searchActive}">${ageDot(h.props, now)}`
      + `<b>${esc(v.name || 'Senza nome')}</b><span class="mmsi">${h.mmsi}</span>${line ? `<small>${esc(line)}</small>` : ''}`
      + `${twins > 1 ? `<small class="twins">${twins} navi con questo nome</small>` : ''}</div>`;
  }).join('');
}

function setActive(i) {
  searchActive = i;
  renderResults();
  const id = 'res-' + searchHits[i].mmsi;
  $('q').setAttribute('aria-activedescendant', id);
  document.getElementById(id)?.scrollIntoView?.({ block: 'nearest' });
}

async function runSearch(text) {
  const q = norm(text);
  if (q.length < 2) return;
  searchCtl?.abort();
  const ctl = searchCtl = typeof AbortController === 'function' ? new AbortController() : null;
  const seq = ++searchSeq;
  let remote = [];
  try {
    const res = await fetchApi(`${api()}/search?q=${encodeURIComponent(q)}`, API_TIMEOUT_MS, ctl?.signal);
    const body = res.ok ? await res.json() : null;
    if (Array.isArray(body)) remote = body;
  } catch {
    if (ctl?.signal.aborted) return;   // superata da una ricerca più nuova: niente da mostrare, nessun errore
    // server che non risponde: restano le navi in mappa
  }
  if (seq !== searchSeq || q !== norm($('q').value)) return; // nel frattempo l'utente ha scritto altro
  if (searchCtl === ctl) searchCtl = null;
  const byMmsi = new Map();
  for (const v of remote) {
    if (!v || !v.mmsi) continue;
    // orario, velocità e stato sono della posizione, non dei dati statici: servono per età e scadenza (limiti del server)
    const { timestampExternal, sog, navStat, ...data } = v;
    meta.set(v.mmsi, { ...meta.get(v.mmsi), ...data });
    byMmsi.set(v.mmsi, { mmsi: v.mmsi, latlng: [v.lat, v.lon], props: { mmsi: v.mmsi, timestampExternal, sog, navStat, source: 'aisstream' } });
  }
  // navi in mappa: quelle che il server non ha restituito, o la posizione del marker se è più recente
  for (const [mmsi, m] of markers) {
    const prev = byMmsi.get(mmsi);
    if (prev ? isNewer(m.props.timestampExternal, prev.props.timestampExternal) : searchScore(meta.get(mmsi), mmsi, q) > 0)
      byMmsi.set(mmsi, { mmsi, latlng: m.marker.getLatLng(), props: m.props });
  }
  for (const h of byMmsi.values()) { h.score = searchScore(meta.get(h.mmsi), h.mmsi, q); h.ts = h.props.timestampExternal; }
  searchHits = [...byMmsi.values()].sort(compareSearch).slice(0, SEARCH_MAX);
  found.clear();
  foundProps.clear();
  for (const h of searchHits) { found.set(h.mmsi, h.latlng); foundProps.set(h.mmsi, h.props); }
  searchActive = -1;
  $('q').removeAttribute('aria-activedescendant');
  renderResults();
  showResults();
}

function scheduleSearch() {
  clearTimeout(searchTimer);
  searchTimer = null;
  searchCtl?.abort();
  searchCtl = null;
  searchSeq++;   // una risposta già in viaggio senza AbortController non deve più arrivare nell'elenco
  const q = norm($('q').value);
  if (q.length < 2) { searchHits = []; hideResults(); return; }
  searchTimer = setTimeout(() => { searchTimer = null; runSearch(q); }, SEARCH_WAIT_MS);
}

async function openResult(mmsi) {
  if (!mmsi || !found.has(mmsi)) return;
  hideResults();
  map.setView(found.get(mmsi), Math.max(map.getZoom(), 11), { animate:false });
  await tick();
  select(mmsi, foundProps.get(mmsi));   // senza marker (es. posizione scaduta) la scheda usa la posizione del risultato
}

$('q').addEventListener('input', scheduleSearch);
$('q').addEventListener('keydown', e => {
  const open = $('results').style.display === 'block';
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    if (!searchHits.length || searchTimer) return;
    e.preventDefault();   // la freccia non sposta il cursore nel campo
    if (!open) showResults();
    const n = searchHits.length;
    setActive(e.key === 'ArrowDown' ? (searchActive + 1) % n : searchActive <= 0 ? n - 1 : searchActive - 1);
  } else if (e.key === 'Enter' && open && !searchTimer && searchHits.length) {
    e.preventDefault();
    return openResult(searchHits[Math.max(searchActive, 0)].mmsi);
  }
});
$('results').addEventListener('click', e => openResult(Number(e.target.closest('[data-mmsi]')?.dataset.mmsi)));

async function tick() {
  try { await loadLocations(); }
  catch (err) { $('status').textContent = 'Errore dati AIS: ' + err.message; }
}

(async () => {
  await loadBalticMeta().catch(err => console.warn(err));
  await tick();
  setInterval(tick, REFRESH_MS);
  let moveTimer;
  map.on('moveend', () => { clearTimeout(moveTimer); moveTimer = setTimeout(tick, 300); });
  setInterval(() => loadBalticMeta().catch(() => {}), 10 * 60 * 1000);
})();
</script>
