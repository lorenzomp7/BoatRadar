# Pubblica la pagina su GitHub Pages: https://lorenzomp7.github.io/BoatRadar/
# config.js punta la pagina al server sulla VM Oracle (variabili del repo VM_HOST o API_HOST).
name: GitHub Pages

on:
  push:
    branches: [main]
    paths: [boatradar.html, vesselfinder.html, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepara il sito
        env:
          API_HOST: ${{ vars.API_HOST }}
          VM_HOST: ${{ vars.VM_HOST }}
        run: |
          mkdir _site
          cp boatradar.html _site/index.html
          cp vesselfinder.html _site/
          if [ -z "$API_HOST" ] && [ -n "$VM_HOST" ]; then API_HOST="boatradar.${VM_HOST//./-}.sslip.io"; fi
          if [ -n "$API_HOST" ]; then
            printf 'window.BOATRADAR_API = "https://%s/api";\n' "$API_HOST" > _site/config.js
          else
            echo '// server non ancora configurato: solo dati del Baltico' > _site/config.js
          fi
          cat _site/config.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
