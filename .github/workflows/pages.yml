# Pubblica la pagina su GitHub Pages: https://lorenzomp7.github.io/BoatRadar/
# config.js elenca i server della pagina: VM Oracle (variabili del repo VM_HOST o API_HOST) e Render
# (RENDER_HOST), scritto da tools/config-pages.js.
name: GitHub Pages

on:
  push:
    branches: [main]
    paths: [boatradar.html, vesselfinder.html, public/**, tools/config-pages.js, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepara il sito
        env:
          API_HOST: ${{ vars.API_HOST }}
          VM_HOST: ${{ vars.VM_HOST }}
          RENDER_HOST: ${{ vars.RENDER_HOST }}
        run: |
          mkdir _site
          cp boatradar.html _site/index.html
          # versione del modulo legata al commit: pagina e public/ais-logic.js non restano disallineati nella cache
          sed -i "s|src=\"public/ais-logic.js\"|src=\"public/ais-logic.js?v=${GITHUB_SHA}\"|" _site/index.html
          grep -qF "src=\"public/ais-logic.js?v=${GITHUB_SHA}\"" _site/index.html || { echo "versione di ais-logic.js non applicata a index.html"; exit 1; }
          cp vesselfinder.html _site/
          mkdir -p _site/public && cp public/ais-logic.js _site/public/
          # elenco dei server (VM, poi Render); esce con errore se una variabile non è un nome di host
          node tools/config-pages.js > _site/config.js
          # versione di config.js legata all'esecuzione: un server cambiato non resta nella cache del browser
          sed -i "s|src=\"config.js\"|src=\"config.js?v=${GITHUB_RUN_ID}\"|" _site/index.html
          grep -qF "src=\"config.js?v=${GITHUB_RUN_ID}\"" _site/index.html || { echo "versione di config.js non applicata a index.html"; exit 1; }
          cat _site/config.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
