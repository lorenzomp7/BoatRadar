# Aggiorna il server sulla VM Oracle Always Free a ogni push su main.
# Si attiva solo dopo aver impostato: variabile VM_HOST (IP pubblico della VM),
# secret VM_SSH_KEY (chiave privata SSH) e secret AISSTREAM_KEY. Vedi README.
name: Deploy backend

on:
  push:
    branches: [main]
    paths: [server.js, package.json, package-lock.json, Dockerfile, deploy/**, .github/workflows/deploy-backend.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.VM_HOST != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP: boatradar
      PORT: 8765
      VM_HOST: ${{ vars.VM_HOST }}
      VM_USER: ${{ vars.VM_USER || 'ubuntu' }}
      API_HOST: ${{ vars.API_HOST }}
    steps:
      - uses: actions/checkout@v4
      - name: Chiave SSH
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/id_vm && chmod 600 ~/.ssh/id_vm
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts
      - name: Configurazione dell'app
        env:
          AISSTREAM_KEY: ${{ secrets.AISSTREAM_KEY }}
          CORS_ORIGIN: ${{ vars.CORS_ORIGIN }}
        run: |
          [ -n "$API_HOST" ] || API_HOST="$APP.${VM_HOST//./-}.sslip.io"
          umask 077
          printf 'AISSTREAM_KEY=%s\nCORS_ORIGIN=%s\n' "$AISSTREAM_KEY" "${CORS_ORIGIN:-*}" > deploy/.env
          printf '%s {\n\treverse_proxy %s:%s\n}\n' "$API_HOST" "$APP" "$PORT" > deploy/site.caddy
          echo "Indirizzo del server: https://$API_HOST"
      - name: Copia sulla VM e avvia
        run: |
          SSH="ssh -i $HOME/.ssh/id_vm"
          $SSH "$VM_USER@$VM_HOST" "sudo mkdir -p /opt/apps/$APP && sudo chown \$USER /opt/apps/$APP && (command -v rsync >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq rsync))"
          rsync -az --delete -e "$SSH" --exclude .git --exclude node_modules ./ "$VM_USER@$VM_HOST:/opt/apps/$APP/"
          $SSH "$VM_USER@$VM_HOST" "bash /opt/apps/$APP/deploy/remote-deploy.sh $APP"
      - name: Controllo
        run: |
          [ -n "$API_HOST" ] || API_HOST="$APP.${VM_HOST//./-}.sslip.io"
          for i in $(seq 1 20); do curl -fsS "https://$API_HOST/api/status" && exit 0; sleep 6; done
          echo "Il server non risponde su https://$API_HOST/api/status" && exit 1
