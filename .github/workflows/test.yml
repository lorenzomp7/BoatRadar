name: Test

on:
  pull_request:
  push:
    branches: [main, main_claude]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --check server.js && node --check position-check.js && node --check sample.js && node --check public/ais-logic.js
      - run: npm test
